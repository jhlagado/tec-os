<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 106" role="img" aria-labelledby="title">
<title id="title">Set a breakpoint in Code and run to it</title>
<style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd}}
rect {fill:var(--panel);stroke:var(--edge)}
text {fill:currentColor;font:15px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 16px system-ui,sans-serif}
.mark {fill:var(--accent);font-weight:bold}
.arrow {fill:var(--accent);font:bold 22px system-ui,sans-serif}
</style>
<rect x="18.0" y="8" width="209.33333333333334" height="90" rx="7"/>
<text class="head" x="31.0" y="34">Select in Code</text>
<text x="31.0" y="61">&gt; 0104 POP DE</text>
<text x="31.0" y="88">Press B</text>
<text class="arrow" text-anchor="middle" x="241.33333333333334" y="60.0">→</text>
<rect x="255.33333333333334" y="8" width="209.33333333333334" height="90" rx="7"/>
<text class="head" x="268.33333333333337" y="34">Breakpoint set</text>
<text class="mark" x="268.33333333333337" y="61">&gt;□0104 POP DE</text>
<text x="268.33333333333337" y="88">Press R</text>
<text class="arrow" text-anchor="middle" x="478.6666666666667" y="60.0">→</text>
<rect x="492.6666666666667" y="8" width="209.33333333333334" height="90" rx="7"/>
<text class="head" x="505.6666666666667" y="34">Program stopped</text>
<text class="mark" x="505.6666666666667" y="61">&gt;PC 0104  BP</text>
<text x="505.6666666666667" y="88">POP DE is next</text>
</svg>
