<svg xmlns="http://www.w3.org/2000/svg" width="720" height="266" viewBox="0 0 720 266" role="img" aria-labelledby="title desc">
<title id="title">TBG in high memory with separate console and LCD paths</title>
<desc id="desc">TEC-OS ROM sits at C000h to FFFFh. TBG.SVC (about 7.5 KiB) loads at the top of RAM below the ROM. The program runs from 0100h up to the address at 0006h where TBG begins, above page zero. TBG uses the 20x4 LCD and matrix keyboard while the program keeps the main console.</desc>
<defs><style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48;--paper:#fff}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd;--paper:#1c1f22}}
rect {fill:var(--panel);stroke:var(--edge);stroke-width:1.3}
text {fill:currentColor;font:14px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 15px system-ui,sans-serif}
.note {font:14px system-ui,sans-serif}
.small {font:12px ui-monospace,monospace}
.accent {fill:var(--accent);font-weight:bold}
.arrow {fill:none;stroke:var(--accent);stroke-width:1.6}
.highlight {stroke:var(--accent);stroke-width:2.5}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<text class="head" x="204" y="24" text-anchor="middle" xml:space="preserve">Memory (not to scale)</text>
<text class="head" x="548" y="24" text-anchor="middle" xml:space="preserve">Separate displays</text>
<rect class="" x="84" y="42" width="240" height="36" rx="4"/>
<text class="head" x="204" y="65" text-anchor="middle" xml:space="preserve">TEC-OS ROM</text>
<rect class="highlight" x="84" y="78" width="240" height="46" rx="4"/>
<text class="head" x="204" y="106" text-anchor="middle" xml:space="preserve">TBG.SVC (~7.5 KiB)</text>
<rect class="" x="84" y="124" width="240" height="56" rx="4"/>
<text class="head" x="204" y="157" text-anchor="middle" xml:space="preserve">Program (TPA)</text>
<rect class="" x="84" y="180" width="240" height="36" rx="4"/>
<text class="" x="204" y="203" text-anchor="middle" xml:space="preserve">Page zero</text>
<text class="small" x="76" y="48" text-anchor="end" xml:space="preserve">FFFFh</text>
<text class="small" x="76" y="82" text-anchor="end" xml:space="preserve">C000h</text>
<text class="accent" x="76" y="128" text-anchor="end" xml:space="preserve">(0006h)</text>
<text class="small" x="76" y="184" text-anchor="end" xml:space="preserve">0100h</text>
<text class="small" x="76" y="216" text-anchor="end" xml:space="preserve">0000h</text>
<path class="arrow" d="M326 101 L412 95" marker-end="url(#arrow)"/>
<path class="arrow" d="M326 152 L412 169" marker-end="url(#arrow)"/>
<rect class="highlight" x="416" y="62" width="264" height="66" rx="4"/>
<text class="head" x="548" y="87" text-anchor="middle" xml:space="preserve">20 × 4 LCD</text>
<text class="" x="548" y="112" text-anchor="middle" xml:space="preserve">Matrix keyboard</text>
<rect class="" x="416" y="140" width="264" height="66" rx="4"/>
<text class="head" x="548" y="165" text-anchor="middle" xml:space="preserve">Main console</text>
<text class="" x="548" y="190" text-anchor="middle" xml:space="preserve">9918 / TTY / GLCD</text>
<text class="note" x="360" y="248" text-anchor="middle" xml:space="preserve">TBG is loaded at the top of RAM, below the ROM. Program memory ends where TBG begins (0006h).</text>
</svg>
