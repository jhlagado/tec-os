<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 106" role="img" aria-labelledby="title">
<title id="title">From the CP/M prompt to the stopped program</title>
<style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd}}
rect {fill:var(--panel);stroke:var(--edge)}
text {fill:currentColor;font:15px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 16px system-ui,sans-serif}
.mark {fill:var(--accent);font-weight:bold}
.arrow {fill:var(--accent);font:bold 22px system-ui,sans-serif}
</style>
<rect x="18.0" y="8" width="328.0" height="90" rx="7"/>
<text class="head" x="31.0" y="34">At the CP/M prompt</text>
<text x="31.0" y="61">A&gt;TBG.SVC DEMO</text>
<text x="31.0" y="88">Type on the 9918</text>
<text class="arrow" text-anchor="middle" x="360.0" y="60.0">→</text>
<rect x="374.0" y="8" width="328.0" height="90" rx="7"/>
<text class="head" x="387.0" y="34">At the first LCD stop</text>
<text class="mark" x="387.0" y="61">&gt;PC 0100</text>
<text x="387.0" y="88">Focus the LCD to step</text>
</svg>
