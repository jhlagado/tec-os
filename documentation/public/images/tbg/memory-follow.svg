<svg xmlns="http://www.w3.org/2000/svg" width="720" height="272" viewBox="0 0 720 272" role="img" aria-labelledby="title desc">
<title id="title">Following HL across the FILL.COM buffer in Memory</title>
<desc id="desc">In FILL.COM, opening Memory via Enter on HL locks the display to HL at 010Ah. When LD (HL),B writes 04h and INC HL advances HL to 010Bh, Memory moves to 010Bh automatically. Scrolling away appends + (HL+). Editing with E writes only from 0100h up to the lowest resident service.</desc>
<defs><style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48;--paper:#fff}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd;--paper:#1c1f22}}
rect {fill:var(--panel);stroke:var(--edge);stroke-width:1.3}
text {fill:currentColor;font:14px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 15px system-ui,sans-serif}
.note {font:14px system-ui,sans-serif}
.small {font:12px ui-monospace,monospace}
.accent {fill:var(--accent);font-weight:bold}
.arrow {fill:none;stroke:var(--accent);stroke-width:1.6}
.highlight {stroke:var(--accent);stroke-width:2.5}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<text class="head" x="190" y="26" text-anchor="middle" xml:space="preserve">After LD (HL),B at 010Ah</text>
<text class="head" x="530" y="26" text-anchor="middle" xml:space="preserve">After INC HL · Memory moves to 010Bh</text>
<text class="small" x="64" y="46" text-anchor="middle" xml:space="preserve">010A</text>
<rect class="highlight" x="24" y="54" width="80" height="44" rx="4"/>
<text class="accent" x="64" y="83" text-anchor="middle" xml:space="preserve">04</text>
<text class="small" x="144" y="46" text-anchor="middle" xml:space="preserve">010B</text>
<rect class="" x="104" y="54" width="80" height="44" rx="4"/>
<text class="" x="144" y="83" text-anchor="middle" xml:space="preserve">00</text>
<text class="small" x="224" y="46" text-anchor="middle" xml:space="preserve">010C</text>
<rect class="" x="184" y="54" width="80" height="44" rx="4"/>
<text class="" x="224" y="83" text-anchor="middle" xml:space="preserve">00</text>
<text class="small" x="304" y="46" text-anchor="middle" xml:space="preserve">010D</text>
<rect class="" x="264" y="54" width="80" height="44" rx="4"/>
<text class="" x="304" y="83" text-anchor="middle" xml:space="preserve">00</text>
<text class="accent" x="184" y="120" text-anchor="middle" xml:space="preserve">010A&gt;04 00 00 00 HL</text>
<path class="arrow" d="M350 76 L372 76" marker-end="url(#arrow)"/>
<text class="small" x="416" y="46" text-anchor="middle" xml:space="preserve">010B</text>
<rect class="highlight" x="376" y="54" width="80" height="44" rx="4"/>
<text class="accent" x="416" y="83" text-anchor="middle" xml:space="preserve">00</text>
<text class="small" x="496" y="46" text-anchor="middle" xml:space="preserve">010C</text>
<rect class="" x="456" y="54" width="80" height="44" rx="4"/>
<text class="" x="496" y="83" text-anchor="middle" xml:space="preserve">00</text>
<text class="small" x="576" y="46" text-anchor="middle" xml:space="preserve">010D</text>
<rect class="" x="536" y="54" width="80" height="44" rx="4"/>
<text class="" x="576" y="83" text-anchor="middle" xml:space="preserve">00</text>
<text class="small" x="656" y="46" text-anchor="middle" xml:space="preserve">010E</text>
<rect class="" x="616" y="54" width="80" height="44" rx="4"/>
<text class="" x="656" y="83" text-anchor="middle" xml:space="preserve">00</text>
<text class="accent" x="536" y="120" text-anchor="middle" xml:space="preserve">010B&gt;00 00 00 00 HL</text>
<rect class="" x="24" y="148" width="120" height="48" rx="4"/>
<text class="small" x="84" y="177" text-anchor="middle" xml:space="preserve">0000h–00FFh</text>
<rect class="highlight" x="144" y="148" width="356" height="48" rx="4"/>
<text class="head" x="322" y="169" text-anchor="middle" xml:space="preserve">Writable with E (0100h to lowest service)</text>
<text class="small" x="322" y="188" text-anchor="middle" xml:space="preserve">Program code, data and stack · EDT mode</text>
<rect class="" x="500" y="148" width="196" height="48" rx="4"/>
<text class="small" x="598" y="177" text-anchor="middle" xml:space="preserve">TBG / ROM (protected)</text>
<text class="note" x="360" y="226" text-anchor="middle" xml:space="preserve">Scrolling while following a register shows HL+. Opening via Tab or G uses FIX.</text>
<text class="note" x="360" y="252" text-anchor="middle" xml:space="preserve">Editing refuses addresses below 0100h or inside resident services so TBG stays intact.</text>
</svg>
