<svg xmlns="http://www.w3.org/2000/svg" width="720" height="274" viewBox="0 0 720 274" role="img" aria-labelledby="title desc">
<title id="title">PUSH HL in Stack view and in little-endian Memory</title>
<desc id="desc">In STEP.COM, LD HL,$1234 loads HL, then PUSH HL moves SP down by two bytes from 98FEh to 98FCh and stores 34h at 98FCh and 12h at 98FDh. Stack view shows the word 1234 while Memory shows the bytes in address order as 34 12.</desc>
<defs><style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48;--paper:#fff}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd;--paper:#1c1f22}}
rect {fill:var(--panel);stroke:var(--edge);stroke-width:1.3}
text {fill:currentColor;font:14px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 15px system-ui,sans-serif}
.note {font:14px system-ui,sans-serif}
.small {font:12px ui-monospace,monospace}
.accent {fill:var(--accent);font-weight:bold}
.arrow {fill:none;stroke:var(--accent);stroke-width:1.6}
.highlight {stroke:var(--accent);stroke-width:2.5}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<rect class="" x="24" y="20" width="200" height="86" rx="4"/>
<text class="head" x="124" y="45" text-anchor="middle" xml:space="preserve">Before PUSH HL</text>
<text class="" x="124" y="70" text-anchor="middle" xml:space="preserve">PC 0103 · HL 1234</text>
<text class="" x="124" y="90" text-anchor="middle" xml:space="preserve">SP = 98FEh</text>
<path class="arrow" d="M226 63 L254 63" marker-end="url(#arrow)"/>
<rect class="" x="260" y="20" width="200" height="86" rx="4"/>
<text class="head" x="360" y="45" text-anchor="middle" xml:space="preserve">After PUSH HL</text>
<text class="" x="360" y="70" text-anchor="middle" xml:space="preserve">PC 0104 · SP 98FCh</text>
<text class="" x="360" y="90" text-anchor="middle" xml:space="preserve">Stack top: 1234</text>
<path class="arrow" d="M462 63 L490 63" marker-end="url(#arrow)"/>
<rect class="" x="496" y="20" width="200" height="86" rx="4"/>
<text class="head" x="596" y="45" text-anchor="middle" xml:space="preserve">After POP DE</text>
<text class="" x="596" y="70" text-anchor="middle" xml:space="preserve">PC 0105 · DE 1234</text>
<text class="" x="596" y="90" text-anchor="middle" xml:space="preserve">SP = 98FEh</text>

<text class="head" x="170" y="140" text-anchor="middle" xml:space="preserve">Stack view (16-bit words)</text>
<text class="head" x="520" y="140" text-anchor="middle" xml:space="preserve">Memory view (bytes in address order)</text>
<rect class="highlight" x="46" y="152" width="248" height="84" rx="4"/>
<text class="head" x="170" y="177" text-anchor="middle" xml:space="preserve">&gt;SP 98FC  1234</text>
<text class="" x="170" y="202" text-anchor="middle" xml:space="preserve">    98FE  9C51</text>
<text class="" x="170" y="222" text-anchor="middle" xml:space="preserve">High byte paired with low</text>
<path class="arrow" d="M298 194 L344 194" marker-end="url(#arrow)"/>
<text class="small" x="393" y="166" text-anchor="middle" xml:space="preserve">98FC</text>
<rect class="highlight" x="350" y="174" width="86" height="46" rx="4"/>
<text class="accent" x="393" y="203" text-anchor="middle" xml:space="preserve">34</text>
<text class="small" x="479" y="166" text-anchor="middle" xml:space="preserve">98FD</text>
<rect class="highlight" x="436" y="174" width="86" height="46" rx="4"/>
<text class="accent" x="479" y="203" text-anchor="middle" xml:space="preserve">12</text>
<text class="small" x="565" y="166" text-anchor="middle" xml:space="preserve">98FE</text>
<rect class="" x="522" y="174" width="86" height="46" rx="4"/>
<text class="" x="565" y="203" text-anchor="middle" xml:space="preserve">51</text>
<text class="small" x="651" y="166" text-anchor="middle" xml:space="preserve">98FF</text>
<rect class="" x="608" y="174" width="86" height="46" rx="4"/>
<text class="" x="651" y="203" text-anchor="middle" xml:space="preserve">9C</text>
<text class="note" x="360" y="260" text-anchor="middle" xml:space="preserve">The Z80 stores the low byte (34h) at the lower address and the high byte (12h) above it.</text>
</svg>
