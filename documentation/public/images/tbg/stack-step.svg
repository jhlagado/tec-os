<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">PUSH HL in Stack view and in little-endian Memory</title>
  <desc id="figDesc">In STEP.COM, LD HL,$1234 loads HL, then PUSH HL moves SP down by two bytes from 98FEh to 98FCh and stores 34h at 98FCh and 12h at 98FDh. Stack view shows the word 1234 while Memory shows the bytes in address order as 34 12.</desc>
  <defs>
    <style>
      :root {
        --ink:    #111417;
        --ink-2:  #3a4148;
        --dim:    #656d75;
        --rule:   #d0d4d8;
        --fill:   #ffffff;
        --fill-2: #f1f3f2;
        --sig:    #236c4a;
        --sig-bg: #eef6f1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink:    #e8ecea;
          --ink-2:  #b5beb9;
          --dim:    #828d87;
          --rule:   #38403c;
          --fill:   #1c1f22;
          --fill-2: #24292c;
          --sig:    #6ec996;
          --sig-bg: #182b22;
        }
      }

      .bx      { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.4; }
      .bxq     { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.3; }
      .bxs     { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 1.9; }
      .pill    { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.1; }
      .pill-s  { fill: var(--fill);   stroke: var(--sig);  stroke-width: 1.2; }
      .sig-dot { fill: var(--sig);    stroke: none; }
      .ink-dot { fill: var(--ink);    stroke: none; }

      .rule    { fill: none; stroke: var(--rule); stroke-width: 1; }
      .tick    { fill: none; stroke: var(--dim);  stroke-width: 1; }
      .ln      { fill: none; stroke: var(--ink);  stroke-width: 1.4; }
      .sline   { fill: none; stroke: var(--sig);  stroke-width: 1.8; }
      .dash    { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }

      .t       { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .tb      { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .ts      { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
      .nb      { font: 600 13.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
      .ns      { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
      .dim     { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
      .dimn    { font: 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
      .cap     { font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--sig); letter-spacing: 0.12em; }
      .dim-cap { font: 600 9.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); letter-spacing: 0.1em; }
      .pill-t  { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .pill-ts { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--sig); }
      .inv     { font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--fill); }
      .on-sig  { fill: var(--sig); }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.8 L10,5 L0,9.2 Z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.8 L10,5 L0,9.2 Z" fill="var(--sig)"/>
    </marker>
  </defs>
  <text class="cap" x="40" y="30" text-anchor="start" xml:space="preserve">STEP.COM · THREE CONSECUTIVE STATES</text>
  <rect class="bx" x="40" y="46" width="190" height="82" rx="5"/>
  <text class="nb" x="58" y="74" text-anchor="start" xml:space="preserve">Before PUSH HL</text>
  <text class="t" x="58" y="97" text-anchor="start" xml:space="preserve">PC 0103 · HL 1234</text>
  <text class="t" x="58" y="116" text-anchor="start" xml:space="preserve">SP = 98FEh</text>
  <line class="ln" x1="230" y1="87" x2="261" y2="87" marker-end="url(#ar)"/>
  <rect class="bxs" x="265" y="46" width="190" height="82" rx="5"/>
  <text class="nb on-sig" x="283" y="74" text-anchor="start" xml:space="preserve">After PUSH HL</text>
  <text class="t" x="283" y="97" text-anchor="start" xml:space="preserve">PC 0104 · SP 98FCh</text>
  <text class="t" x="283" y="116" text-anchor="start" xml:space="preserve">Top word = 1234</text>
  <line class="ln" x1="455" y1="87" x2="486" y2="87" marker-end="url(#ar)"/>
  <rect class="bx" x="490" y="46" width="190" height="82" rx="5"/>
  <text class="nb" x="508" y="74" text-anchor="start" xml:space="preserve">After POP DE</text>
  <text class="t" x="508" y="97" text-anchor="start" xml:space="preserve">PC 0105 · DE 1234</text>
  <text class="t" x="508" y="116" text-anchor="start" xml:space="preserve">SP = 98FEh</text>
  <line class="rule" x1="40" y1="154" x2="680" y2="154"/>
  <text class="cap" x="102" y="180" text-anchor="start" xml:space="preserve">STACK VIEW · 16-BIT WORDS</text>
  <text class="cap" x="376" y="180" text-anchor="start" xml:space="preserve">MEMORY VIEW · BYTES IN ADDRESS ORDER</text>
  <text class="cap" x="40" y="238" text-anchor="start" xml:space="preserve">SP</text>
  <line class="sline" x1="64" y1="234" x2="98" y2="234" marker-end="url(#arS)"/>
  <rect class="bx" x="102" y="254" width="190" height="40" rx="0"/>
  <text class="dim" x="120" y="278" text-anchor="start" xml:space="preserve">98FE</text>
  <text class="t" x="274" y="278.5" text-anchor="end" xml:space="preserve">9C51</text>
  <rect class="bxs" x="102" y="214" width="190" height="40" rx="0"/>
  <text class="dim on-sig" x="120" y="238" text-anchor="start" xml:space="preserve">98FC</text>
  <text class="tb on-sig" x="274" y="238.5" text-anchor="end" xml:space="preserve">1234</text>
  <text class="dimn" x="102" y="312" text-anchor="start" xml:space="preserve">High byte paired with low</text>
  <line class="sline" x1="296" y1="234" x2="368" y2="234" marker-end="url(#arS)"/>
  <text class="dim" x="566" y="205" text-anchor="middle" xml:space="preserve">98FE</text>
  <rect class="bx" x="528" y="214" width="76" height="40" rx="0"/>
  <text class="t" x="566" y="238.5" text-anchor="middle" xml:space="preserve">51</text>
  <text class="dim" x="642" y="205" text-anchor="middle" xml:space="preserve">98FF</text>
  <rect class="bx" x="604" y="214" width="76" height="40" rx="0"/>
  <text class="t" x="642" y="238.5" text-anchor="middle" xml:space="preserve">9C</text>
  <text class="dim on-sig" x="414" y="205" text-anchor="middle" xml:space="preserve">98FC</text>
  <rect class="bxs" x="376" y="214" width="76" height="40" rx="0"/>
  <text class="tb on-sig" x="414" y="238.5" text-anchor="middle" xml:space="preserve">34</text>
  <text class="ns on-sig" x="414" y="272" text-anchor="middle" xml:space="preserve">low byte</text>
  <text class="dim on-sig" x="490" y="205" text-anchor="middle" xml:space="preserve">98FD</text>
  <rect class="bxs" x="452" y="214" width="76" height="40" rx="0"/>
  <text class="tb on-sig" x="490" y="238.5" text-anchor="middle" xml:space="preserve">12</text>
  <text class="ns on-sig" x="490" y="272" text-anchor="middle" xml:space="preserve">high byte</text>
  <text class="dimn" x="40" y="340" text-anchor="start" xml:space="preserve">The Z80 stores the low byte (34h) at the lower address and the high byte (12h) above it.</text>
</svg>
