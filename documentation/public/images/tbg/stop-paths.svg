<svg xmlns="http://www.w3.org/2000/svg" width="720" height="316" viewBox="0 0 720 316" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Four ways to stop a program at full speed</title>
  <desc id="figDesc">Comparison of four stop methods: F5 in Code with selection off PC runs once with no breakpoint left behind; Space sets a persistent RST 30h breakpoint; holding Ctrl+Esc breaks at the next BDOS call (0005h); TBUG.SVC ARM catches the next COM launch via ABI 5.3 COMVEC.</desc>
  <defs>
    <style>
      :root {
        --ink:    #111417;
        --ink-2:  #3a4148;
        --dim:    #656d75;
        --rule:   #d0d4d8;
        --fill:   #ffffff;
        --fill-2: #f1f3f2;
        --sig:    #236c4a;
        --sig-bg: #eef6f1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink:    #e8ecea;
          --ink-2:  #b5beb9;
          --dim:    #828d87;
          --rule:   #38403c;
          --fill:   #1c1f22;
          --fill-2: #24292c;
          --sig:    #6ec996;
          --sig-bg: #182b22;
        }
      }

      .bx      { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.4; }
      .bxq     { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.3; }
      .bxs     { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 1.9; }
      .pill    { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.1; }
      .pill-s  { fill: var(--fill);   stroke: var(--sig);  stroke-width: 1.2; }
      .sig-dot { fill: var(--sig);    stroke: none; }
      .ink-dot { fill: var(--ink);    stroke: none; }

      .rule    { fill: none; stroke: var(--rule); stroke-width: 1; }
      .tick    { fill: none; stroke: var(--dim);  stroke-width: 1; }
      .ln      { fill: none; stroke: var(--ink);  stroke-width: 1.4; }
      .sline   { fill: none; stroke: var(--sig);  stroke-width: 1.8; }
      .dash    { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }

      .t       { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .tb      { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .ts      { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
      .nb      { font: 600 13.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
      .ns      { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
      .dim     { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
      .dimn    { font: 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
      .cap     { font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--sig); letter-spacing: 0.12em; }
      .dim-cap { font: 600 9.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); letter-spacing: 0.1em; }
      .pill-t  { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .pill-ts { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--sig); }
      .inv     { font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--fill); }
      .on-sig  { fill: var(--sig); }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.8 L10,5 L0,9.2 Z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.8 L10,5 L0,9.2 Z" fill="var(--sig)"/>
    </marker>
  </defs>
  <text class="cap" x="40" y="30" text-anchor="start" xml:space="preserve">FOUR WAYS TO STOP A RUNNING PROGRAM</text>
  <rect class="bx" x="40" y="48" width="306" height="104" rx="5"/>
  <rect class="pill" x="58" y="62" width="74" height="22" rx="3"/>
  <text class="pill-t" x="95" y="77" text-anchor="middle" xml:space="preserve">F5 off PC</text>
  <text class="dim-cap" x="328" y="77" text-anchor="end" xml:space="preserve">ONE-SHOT</text>
  <text class="nb" x="58" y="102" text-anchor="start" xml:space="preserve">Run to selection</text>
  <text class="ns" x="58" y="122" text-anchor="start" xml:space="preserve">Temporary stop at the cursor row</text>
  <text class="ns" x="58" y="140" text-anchor="start" xml:space="preserve">Leaves no □ breakpoint behind</text>
  <rect class="bxs" x="374" y="48" width="306" height="104" rx="5"/>
  <rect class="pill-s" x="392" y="62" width="47" height="22" rx="3"/>
  <text class="pill-ts" x="415.5" y="77" text-anchor="middle" xml:space="preserve">Space</text>
  <text class="dim-cap" x="662" y="77" text-anchor="end" xml:space="preserve">PERSISTENT</text>
  <text class="nb on-sig" x="392" y="102" text-anchor="start" xml:space="preserve">User breakpoint in Code</text>
  <text class="ns" x="392" y="122" text-anchor="start" xml:space="preserve">Up to 8 RST 30h traps in RAM</text>
  <text class="ns" x="392" y="140" text-anchor="start" xml:space="preserve">Address must sit inside the COM</text>
  <rect class="bx" x="40" y="172" width="306" height="104" rx="5"/>
  <rect class="pill" x="58" y="186" width="67" height="22" rx="3"/>
  <text class="pill-t" x="91.5" y="201" text-anchor="middle" xml:space="preserve">Ctrl+Esc</text>
  <text class="dim-cap" x="328" y="201" text-anchor="end" xml:space="preserve">BREAK IN</text>
  <text class="nb" x="58" y="226" text-anchor="start" xml:space="preserve">Hold to interrupt</text>
  <text class="ns" x="58" y="246" text-anchor="start" xml:space="preserve">Stops at the next CALL 0005h</text>
  <text class="ns" x="58" y="264" text-anchor="start" xml:space="preserve">Caller return address sits on stack</text>
  <rect class="bx" x="374" y="172" width="306" height="104" rx="5"/>
  <rect class="pill" x="392" y="186" width="94" height="22" rx="3"/>
  <text class="pill-t" x="439" y="201" text-anchor="middle" xml:space="preserve">TBUG.SVC ARM</text>
  <text class="dim-cap" x="662" y="201" text-anchor="end" xml:space="preserve">NEXT LAUNCH</text>
  <text class="nb" x="392" y="226" text-anchor="start" xml:space="preserve">Catch the next COM</text>
  <text class="ns" x="392" y="246" text-anchor="start" xml:space="preserve">Traps next launch via COMVEC</text>
  <text class="ns" x="392" y="264" text-anchor="start" xml:space="preserve">Requires TEC-OS ABI 5.3 or newer</text>
  <text class="dimn" x="40" y="302" text-anchor="start" xml:space="preserve">Every stop lands in the same TBUG inspection loop, where you can step, inspect or press F5.</text>
</svg>
