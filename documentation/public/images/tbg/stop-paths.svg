<svg xmlns="http://www.w3.org/2000/svg" width="720" height="256" viewBox="0 0 720 256" role="img" aria-labelledby="title desc">
<title id="title">Four ways to stop a program at full speed</title>
<desc id="desc">Comparison of four stop methods: R in Code with selection off PC runs once with no breakpoint left behind; B sets a persistent RST 30h breakpoint; holding Ctrl+Esc breaks at the next BDOS call (0005h); TBG ARM catches the next COM launch via ABI 5.3 COMVEC.</desc>
<defs><style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48;--paper:#fff}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd;--paper:#1c1f22}}
rect {fill:var(--panel);stroke:var(--edge);stroke-width:1.3}
text {fill:currentColor;font:14px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 15px system-ui,sans-serif}
.note {font:14px system-ui,sans-serif}
.small {font:12px ui-monospace,monospace}
.accent {fill:var(--accent);font-weight:bold}
.arrow {fill:none;stroke:var(--accent);stroke-width:1.6}
.highlight {stroke:var(--accent);stroke-width:2.5}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<rect class="" x="24" y="20" width="324" height="96" rx="4"/>
<text class="head" x="186" y="45" text-anchor="middle" xml:space="preserve">R off PC (one-shot)</text>
<text class="" x="186" y="70" text-anchor="middle" xml:space="preserve">Temporary stop at selection</text>
<text class="" x="186" y="90" text-anchor="middle" xml:space="preserve">No □ left behind</text>
<text class="" x="186" y="110" text-anchor="middle" xml:space="preserve">Ideal for loop exits</text>
<rect class="highlight" x="372" y="20" width="324" height="96" rx="4"/>
<text class="head" x="534" y="45" text-anchor="middle" xml:space="preserve">B in Code (persistent)</text>
<text class="" x="534" y="70" text-anchor="middle" xml:space="preserve">Up to 8 RST 30h traps</text>
<text class="" x="534" y="90" text-anchor="middle" xml:space="preserve">Stays set across runs</text>
<text class="" x="534" y="110" text-anchor="middle" xml:space="preserve">Needs address inside COM</text>
<rect class="" x="24" y="134" width="324" height="96" rx="4"/>
<text class="head" x="186" y="159" text-anchor="middle" xml:space="preserve">Ctrl+Esc held (break in)</text>
<text class="" x="186" y="184" text-anchor="middle" xml:space="preserve">Stops at next CALL 0005h</text>
<text class="" x="186" y="204" text-anchor="middle" xml:space="preserve">Return address sits on stack</text>
<text class="" x="186" y="224" text-anchor="middle" xml:space="preserve">Needs OS calls to trigger</text>
<rect class="" x="372" y="134" width="324" height="96" rx="4"/>
<text class="head" x="534" y="159" text-anchor="middle" xml:space="preserve">TBG ARM (next launch)</text>
<text class="" x="534" y="184" text-anchor="middle" xml:space="preserve">Hooks next CCP COM via COMVEC</text>
<text class="" x="534" y="204" text-anchor="middle" xml:space="preserve">Stops at 0100h with normal tail</text>
<text class="" x="534" y="224" text-anchor="middle" xml:space="preserve">Requires TEC-OS ABI 5.3+</text>
<text class="note" x="360" y="248" text-anchor="middle" xml:space="preserve">Every stop lands in the same TBG inspection loop, where you can step, inspect or press R.</text>
</svg>
