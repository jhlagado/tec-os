<svg xmlns="http://www.w3.org/2000/svg" width="720" height="244" viewBox="0 0 720 244" role="img" aria-labelledby="title desc">
<title id="title">Automatic symbol loading from NAME.TBG inside TBUG.SVC</title>
<desc id="desc">TAS writes NAME.TBG beside NAME.COM. When TBUG.SVC stops a program at launch, its built-in symbol loader checks NAME.TBG against the image end address and 16-bit checksum. A match lights up SY on Registers, shows labels in Code and enables the Symbols view on Y.</desc>
<defs><style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48;--paper:#fff}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd;--paper:#1c1f22}}
rect {fill:var(--panel);stroke:var(--edge);stroke-width:1.3}
text {fill:currentColor;font:14px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 15px system-ui,sans-serif}
.note {font:14px system-ui,sans-serif}
.small {font:12px ui-monospace,monospace}
.accent {fill:var(--accent);font-weight:bold}
.arrow {fill:none;stroke:var(--accent);stroke-width:1.6}
.highlight {stroke:var(--accent);stroke-width:2.5}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<rect class="" x="16" y="20" width="212" height="92" rx="4"/>
<text class="head" x="122" y="45" text-anchor="middle" xml:space="preserve">1 · Assemble with TAS</text>
<text class="" x="122" y="70" text-anchor="middle" xml:space="preserve">Writes NAME.COM</text>
<text class="" x="122" y="90" text-anchor="middle" xml:space="preserve">Writes NAME.TBG</text>
<path class="arrow" d="M230 66 L250 66" marker-end="url(#arrow)"/>
<rect class="" x="254" y="20" width="212" height="92" rx="4"/>
<text class="head" x="360" y="45" text-anchor="middle" xml:space="preserve">2 · Launch in TBUG</text>
<text class="" x="360" y="70" text-anchor="middle" xml:space="preserve">Check end address</text>
<text class="" x="360" y="90" text-anchor="middle" xml:space="preserve">Check image sum</text>
<path class="arrow" d="M468 66 L488 66" marker-end="url(#arrow)"/>
<rect class="highlight" x="492" y="20" width="212" height="92" rx="4"/>
<text class="head" x="598" y="45" text-anchor="middle" xml:space="preserve">3 · Symbols active</text>
<text class="" x="598" y="70" text-anchor="middle" xml:space="preserve">SY · Code labels</text>
<text class="" x="598" y="90" text-anchor="middle" xml:space="preserve">Symbols view (Y)</text>
<rect class="" x="16" y="134" width="688" height="82" rx="4"/>
<text class="head" x="360" y="159" text-anchor="middle" xml:space="preserve">Missing or stale NAME.TBG</text>
<text class="" x="360" y="184" text-anchor="middle" xml:space="preserve">TBUG ignores the file quietly and debugs in raw hex</text>
<text class="" x="360" y="204" text-anchor="middle" xml:space="preserve">Reassemble with TAS to write a matching pair</text>
<text class="note" x="360" y="234" text-anchor="middle" xml:space="preserve">Symbol support is built into TBUG.SVC and loads automatically with no extra service.</text>
</svg>
