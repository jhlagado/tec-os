<svg xmlns="http://www.w3.org/2000/svg" width="720" height="276" viewBox="0 0 720 276" role="img" aria-labelledby="title desc">
<title id="title">How TBGSYM.SVC attaches to TBG.SVC through TBGHOOK</title>
<desc id="desc">TBG.SVC sits in about 7.5 KiB at the top of RAM and publishes a TBGHOOK record. Loading TBGSYM.SVC takes about 1.25 KiB below it, fills the hook table at INIT and verifies each program against its .TBG file checksum. UNLOAD removes TBGSYM.SVC first and restores TBGHOOK, leaving TBG.SVC resident.</desc>
<defs><style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48;--paper:#fff}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd;--paper:#1c1f22}}
rect {fill:var(--panel);stroke:var(--edge);stroke-width:1.3}
text {fill:currentColor;font:14px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 15px system-ui,sans-serif}
.note {font:14px system-ui,sans-serif}
.small {font:12px ui-monospace,monospace}
.accent {fill:var(--accent);font-weight:bold}
.arrow {fill:none;stroke:var(--accent);stroke-width:1.6}
.highlight {stroke:var(--accent);stroke-width:2.5}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<text class="head" x="184" y="26" text-anchor="middle" xml:space="preserve">Resident service stack</text>
<text class="head" x="536" y="26" text-anchor="middle" xml:space="preserve">At each program launch</text>
<rect class="highlight" x="24" y="42" width="320" height="62" rx="4"/>
<text class="head" x="184" y="66" text-anchor="middle" xml:space="preserve">TBG.SVC (~7.5 KiB)</text>
<text class="" x="184" y="88" text-anchor="middle" xml:space="preserve">Publishes TBGHOOK record</text>
<path class="arrow" d="M184 128 L184 108" marker-end="url(#arrow)"/>
<rect class="highlight" x="24" y="130" width="320" height="66" rx="4"/>
<text class="head" x="184" y="154" text-anchor="middle" xml:space="preserve">TBGSYM.SVC (~1.25 KiB)</text>
<text class="" x="184" y="176" text-anchor="middle" xml:space="preserve">Hooks TBGHOOK · UNLOAD removes</text>
<rect class="" x="24" y="196" width="320" height="44" rx="4"/>
<text class="" x="184" y="223" text-anchor="middle" xml:space="preserve">Program TPA below TBGSYM</text>
<rect class="" x="376" y="42" width="320" height="84" rx="4"/>
<text class="head" x="536" y="67" text-anchor="middle" xml:space="preserve">1 · Read NAME.TBG</text>
<text class="" x="536" y="92" text-anchor="middle" xml:space="preserve">Check end address</text>
<text class="" x="536" y="112" text-anchor="middle" xml:space="preserve">Check image checksum</text>
<path class="arrow" d="M536 128 L536 150" marker-end="url(#arrow)"/>
<rect class="highlight" x="376" y="154" width="320" height="86" rx="4"/>
<text class="head" x="536" y="179" text-anchor="middle" xml:space="preserve">2 · Match enables symbols</text>
<text class="" x="536" y="204" text-anchor="middle" xml:space="preserve">SY badge · labels in Code</text>
<text class="" x="536" y="224" text-anchor="middle" xml:space="preserve">5th Symbols view in Tab cycle</text>
<text class="note" x="360" y="264" text-anchor="middle" xml:space="preserve">If NAME.TBG is missing or stale after a rebuild, TBG runs cleanly without symbols.</text>
</svg>
