<svg xmlns="http://www.w3.org/2000/svg" width="720" height="278" viewBox="0 0 720 278" role="img" aria-labelledby="title desc">
<title id="title">Switching views and stepping with F6 to F8</title>
<desc id="desc">R, C, S, M and Y jump straight to Registers, Code, Stack, Memory and Symbols, and Tab cycles through them. Enter opens the target of a register, stack slot or branch, Esc steps back and Q quits. F8 steps into, F7 steps over and F6 steps out (Fn+8, Fn+7 and Fn+6 on the TEC-1G).</desc>
<defs><style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48;--paper:#fff}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd;--paper:#1c1f22}}
rect {fill:var(--panel);stroke:var(--edge);stroke-width:1.3}
text {fill:currentColor;font:14px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 15px system-ui,sans-serif}
.note {font:14px system-ui,sans-serif}
.small {font:12px ui-monospace,monospace}
.accent {fill:var(--accent);font-weight:bold}
.arrow {fill:none;stroke:var(--accent);stroke-width:1.6}
.highlight {stroke:var(--accent);stroke-width:2.5}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<text class="head" x="360" y="26" text-anchor="middle" xml:space="preserve">R · C · S · M · Y jump directly   ·   Tab / Shift+Tab cycle</text>
<rect class="highlight" x="16" y="42" width="128" height="82" rx="4"/>
<text class="head" x="80" y="67" text-anchor="middle" xml:space="preserve">R · Registers</text>
<text class="" x="80" y="92" text-anchor="middle" xml:space="preserve">PC, SP, pairs</text>
<text class="" x="80" y="112" text-anchor="middle" xml:space="preserve">Flags &amp; stops</text>
<path class="arrow" d="M146 83 L158 83" marker-end="url(#arrow)"/>
<rect class="" x="160" y="42" width="124" height="82" rx="4"/>
<text class="head" x="222" y="67" text-anchor="middle" xml:space="preserve">C · Code</text>
<text class="" x="222" y="92" text-anchor="middle" xml:space="preserve">Disassembly</text>
<text class="" x="222" y="112" text-anchor="middle" xml:space="preserve">&gt;, →, □, █</text>
<path class="arrow" d="M286 83 L298 83" marker-end="url(#arrow)"/>
<rect class="" x="300" y="42" width="124" height="82" rx="4"/>
<text class="head" x="362" y="67" text-anchor="middle" xml:space="preserve">S · Stack</text>
<text class="" x="362" y="92" text-anchor="middle" xml:space="preserve">4 live words</text>
<text class="" x="362" y="112" text-anchor="middle" xml:space="preserve">from SP down</text>
<path class="arrow" d="M426 83 L438 83" marker-end="url(#arrow)"/>
<rect class="" x="440" y="42" width="124" height="82" rx="4"/>
<text class="head" x="502" y="67" text-anchor="middle" xml:space="preserve">M · Memory</text>
<text class="" x="502" y="92" text-anchor="middle" xml:space="preserve">16 bytes</text>
<text class="" x="502" y="112" text-anchor="middle" xml:space="preserve">FIX or reg</text>
<path class="arrow" d="M566 83 L578 83" marker-end="url(#arrow)"/>
<rect class="" x="580" y="42" width="124" height="82" rx="4"/>
<text class="head" x="642" y="67" text-anchor="middle" xml:space="preserve">Y · Symbols</text>
<text class="" x="642" y="92" text-anchor="middle" xml:space="preserve">Global labels</text>
<text class="" x="642" y="112" text-anchor="middle" xml:space="preserve">from .TBG</text>
<rect class="" x="16" y="152" width="212" height="86" rx="4"/>
<text class="head" x="122" y="177" text-anchor="middle" xml:space="preserve">F8 (Fn+8) · Step Into</text>
<text class="" x="122" y="202" text-anchor="middle" xml:space="preserve">One instruction</text>
<text class="" x="122" y="222" text-anchor="middle" xml:space="preserve">Enters local CALL</text>
<rect class="" x="254" y="152" width="212" height="86" rx="4"/>
<text class="head" x="360" y="177" text-anchor="middle" xml:space="preserve">F7 (Fn+7) · Step Over</text>
<text class="" x="360" y="202" text-anchor="middle" xml:space="preserve">Runs a CALL whole</text>
<text class="" x="360" y="222" text-anchor="middle" xml:space="preserve">Stops after return</text>
<rect class="" x="492" y="152" width="212" height="86" rx="4"/>
<text class="head" x="598" y="177" text-anchor="middle" xml:space="preserve">F6 (Fn+6) · Step Out</text>
<text class="" x="598" y="202" text-anchor="middle" xml:space="preserve">Until SP rises</text>
<text class="" x="598" y="222" text-anchor="middle" xml:space="preserve">Any key interrupts</text>
<text class="note" x="360" y="264" text-anchor="middle" xml:space="preserve">Enter drills down from a register, stack slot or branch. Esc steps back and Q quits.</text>
</svg>
