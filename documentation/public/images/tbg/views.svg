<svg xmlns="http://www.w3.org/2000/svg" width="720" height="434" viewBox="0 0 720 434" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Switching views and stepping with F6 to F8</title>
  <desc id="figDesc">R, C, S, M and Y jump straight to Registers, Code, Stack, Memory and Symbols, and Tab cycles through them. Enter opens the target of a register, stack slot or branch, Esc steps back and Q quits. F8 steps into, F7 steps over and F6 steps out (Fn+8, Fn+7 and Fn+6 on the TEC-1G).</desc>
  <defs>
    <style>
      :root {
        --ink:    #111417;
        --ink-2:  #3a4148;
        --dim:    #656d75;
        --rule:   #d0d4d8;
        --fill:   #ffffff;
        --fill-2: #f1f3f2;
        --sig:    #236c4a;
        --sig-bg: #eef6f1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink:    #e8ecea;
          --ink-2:  #b5beb9;
          --dim:    #828d87;
          --rule:   #38403c;
          --fill:   #1c1f22;
          --fill-2: #24292c;
          --sig:    #6ec996;
          --sig-bg: #182b22;
        }
      }

      .bx      { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.4; }
      .bxq     { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.3; }
      .bxs     { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 1.9; }
      .pill    { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.1; }
      .pill-s  { fill: var(--fill);   stroke: var(--sig);  stroke-width: 1.2; }
      .sig-dot { fill: var(--sig);    stroke: none; }
      .ink-dot { fill: var(--ink);    stroke: none; }

      .rule    { fill: none; stroke: var(--rule); stroke-width: 1; }
      .tick    { fill: none; stroke: var(--dim);  stroke-width: 1; }
      .ln      { fill: none; stroke: var(--ink);  stroke-width: 1.4; }
      .sline   { fill: none; stroke: var(--sig);  stroke-width: 1.8; }
      .dash    { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }

      .t       { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .tb      { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .ts      { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
      .nb      { font: 600 13.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
      .ns      { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
      .dim     { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
      .dimn    { font: 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
      .cap     { font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--sig); letter-spacing: 0.12em; }
      .dim-cap { font: 600 9.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); letter-spacing: 0.1em; }
      .pill-t  { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .pill-ts { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--sig); }
      .inv     { font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--fill); }
      .on-sig  { fill: var(--sig); }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.8 L10,5 L0,9.2 Z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.8 L10,5 L0,9.2 Z" fill="var(--sig)"/>
    </marker>
  </defs>
  <text class="cap" x="40" y="30" text-anchor="start" xml:space="preserve">FIVE VIEWS · PRESS KEY TO JUMP OR TAB / SHIFT+TAB TO CYCLE</text>
  <rect class="bxs" x="40" y="48" width="198" height="86" rx="5"/>
  <rect class="pill-s" x="58" y="62" width="24" height="22" rx="3"/>
  <text class="pill-ts" x="70" y="77" text-anchor="middle" xml:space="preserve">R</text>
  <text class="nb on-sig" x="92" y="77.5" text-anchor="start" xml:space="preserve">Registers</text>
  <text class="ns" x="58" y="102" text-anchor="start" xml:space="preserve">PC, SP and pairs</text>
  <text class="ns" x="58" y="121" text-anchor="start" xml:space="preserve">Flags and stop reason</text>
  <rect class="bx" x="261" y="48" width="198" height="86" rx="5"/>
  <rect class="pill" x="279" y="62" width="24" height="22" rx="3"/>
  <text class="pill-t" x="291" y="77" text-anchor="middle" xml:space="preserve">C</text>
  <text class="nb" x="313" y="77.5" text-anchor="start" xml:space="preserve">Code</text>
  <text class="ns" x="279" y="102" text-anchor="start" xml:space="preserve">Live disassembly</text>
  <text class="ns" x="279" y="121" text-anchor="start" xml:space="preserve">Marks: &gt;  →  □  █</text>
  <rect class="bx" x="482" y="48" width="198" height="86" rx="5"/>
  <rect class="pill" x="500" y="62" width="24" height="22" rx="3"/>
  <text class="pill-t" x="512" y="77" text-anchor="middle" xml:space="preserve">S</text>
  <text class="nb" x="534" y="77.5" text-anchor="start" xml:space="preserve">Stack</text>
  <text class="ns" x="500" y="102" text-anchor="start" xml:space="preserve">Four 16-bit words</text>
  <text class="ns" x="500" y="121" text-anchor="start" xml:space="preserve">From SP downward</text>
  <rect class="bx" x="126" y="154" width="220" height="86" rx="5"/>
  <rect class="pill" x="144" y="168" width="24" height="22" rx="3"/>
  <text class="pill-t" x="156" y="183" text-anchor="middle" xml:space="preserve">M</text>
  <text class="nb" x="178" y="183.5" text-anchor="start" xml:space="preserve">Memory</text>
  <text class="ns" x="144" y="208" text-anchor="start" xml:space="preserve">16-byte hex window</text>
  <text class="ns" x="144" y="227" text-anchor="start" xml:space="preserve">FIX or register follow</text>
  <rect class="bx" x="374" y="154" width="220" height="86" rx="5"/>
  <rect class="pill" x="392" y="168" width="24" height="22" rx="3"/>
  <text class="pill-t" x="404" y="183" text-anchor="middle" xml:space="preserve">Y</text>
  <text class="nb" x="426" y="183.5" text-anchor="start" xml:space="preserve">Symbols</text>
  <text class="ns" x="392" y="208" text-anchor="start" xml:space="preserve">Global labels</text>
  <text class="ns" x="392" y="227" text-anchor="start" xml:space="preserve">Loaded from .TBG</text>
  <line class="rule" x1="40" y1="264" x2="680" y2="264"/>
  <text class="cap" x="40" y="290" text-anchor="start" xml:space="preserve">STEPPING KEYS · F8, F7 AND F6 (FN+8, FN+7, FN+6 ON TEC-1G)</text>
  <rect class="bx" x="40" y="308" width="198" height="86" rx="5"/>
  <rect class="pill" x="58" y="322" width="28" height="22" rx="3"/>
  <text class="pill-t" x="72" y="337" text-anchor="middle" xml:space="preserve">F8</text>
  <text class="nb" x="96" y="337.5" text-anchor="start" xml:space="preserve">Step into</text>
  <text class="ns" x="58" y="362" text-anchor="start" xml:space="preserve">One instruction</text>
  <text class="ns" x="58" y="381" text-anchor="start" xml:space="preserve">Enters a local CALL</text>
  <rect class="bx" x="261" y="308" width="198" height="86" rx="5"/>
  <rect class="pill" x="279" y="322" width="28" height="22" rx="3"/>
  <text class="pill-t" x="293" y="337" text-anchor="middle" xml:space="preserve">F7</text>
  <text class="nb" x="317" y="337.5" text-anchor="start" xml:space="preserve">Step over</text>
  <text class="ns" x="279" y="362" text-anchor="start" xml:space="preserve">Runs a CALL whole</text>
  <text class="ns" x="279" y="381" text-anchor="start" xml:space="preserve">Stops after return</text>
  <rect class="bx" x="482" y="308" width="198" height="86" rx="5"/>
  <rect class="pill" x="500" y="322" width="28" height="22" rx="3"/>
  <text class="pill-t" x="514" y="337" text-anchor="middle" xml:space="preserve">F6</text>
  <text class="nb" x="538" y="337.5" text-anchor="start" xml:space="preserve">Step out</text>
  <text class="ns" x="500" y="362" text-anchor="start" xml:space="preserve">Runs until SP rises</text>
  <text class="ns" x="500" y="381" text-anchor="start" xml:space="preserve">Any key interrupts</text>
  <text class="dimn" x="40" y="418" text-anchor="start" xml:space="preserve">Enter drills down from a register, stack slot or branch. Esc steps back and Q quits.</text>
</svg>
