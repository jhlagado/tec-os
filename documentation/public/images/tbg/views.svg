<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 133" role="img" aria-labelledby="title">
<title id="title">TBG view navigation</title>
<style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd}}
rect {fill:var(--panel);stroke:var(--edge)}
text {fill:currentColor;font:15px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 16px system-ui,sans-serif}
.mark {fill:var(--accent);font-weight:bold}
.arrow {fill:var(--accent);font:bold 22px system-ui,sans-serif}
</style>
<rect x="18.0" y="8" width="209.33333333333334" height="117" rx="7"/>
<text class="head" x="31.0" y="34">Cycle with Tab</text>
<text x="31.0" y="61">Registers → Code</text>
<text x="31.0" y="88">Code → Stack</text>
<text x="31.0" y="115">Shift+Tab goes back</text>
<rect x="255.33333333333334" y="8" width="209.33333333333334" height="117" rx="7"/>
<text class="head" x="268.33333333333337" y="34">Memory</text>
<text x="268.33333333333337" y="61">Fixed or following</text>
<text x="268.33333333333337" y="88">← / → move cursor</text>
<text x="268.33333333333337" y="115">↑ / ↓ scroll rows</text>
<rect x="492.6666666666667" y="8" width="209.33333333333334" height="117" rx="7"/>
<text class="head" x="505.6666666666667" y="34">Symbols</text>
<text x="505.6666666666667" y="61">With TAS symbols</text>
<text x="505.6666666666667" y="88">↑ / ↓ pick symbol</text>
<text x="505.6666666666667" y="115">B marks a label</text>
</svg>
