<svg xmlns="http://www.w3.org/2000/svg" width="720" height="324" viewBox="0 0 720 324" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">TBUG in high memory with separate console and LCD paths</title>
  <desc id="figDesc">TEC-OS ROM sits at C000h to FFFFh. TBUG.SVC loads at the top of RAM below the ROM. The program runs from 0100h up to the address at 0006h where TBUG begins, above page zero. TBUG uses the 20x4 LCD and matrix keyboard while the program keeps the console.</desc>
  <defs>
    <style>
      :root {
        --ink:    #111417;
        --ink-2:  #3a4148;
        --dim:    #656d75;
        --rule:   #d0d4d8;
        --fill:   #ffffff;
        --fill-2: #f1f3f2;
        --sig:    #236c4a;
        --sig-bg: #eef6f1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink:    #e8ecea;
          --ink-2:  #b5beb9;
          --dim:    #828d87;
          --rule:   #38403c;
          --fill:   #1c1f22;
          --fill-2: #24292c;
          --sig:    #6ec996;
          --sig-bg: #182b22;
        }
      }

      .bx      { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.4; }
      .bxq     { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.3; }
      .bxs     { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 1.9; }
      .pill    { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.1; }
      .pill-s  { fill: var(--fill);   stroke: var(--sig);  stroke-width: 1.2; }
      .sig-dot { fill: var(--sig);    stroke: none; }
      .ink-dot { fill: var(--ink);    stroke: none; }

      .rule    { fill: none; stroke: var(--rule); stroke-width: 1; }
      .tick    { fill: none; stroke: var(--dim);  stroke-width: 1; }
      .ln      { fill: none; stroke: var(--ink);  stroke-width: 1.4; }
      .sline   { fill: none; stroke: var(--sig);  stroke-width: 1.8; }
      .dash    { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }

      .t       { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .tb      { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .ts      { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
      .nb      { font: 600 13.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
      .ns      { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
      .dim     { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
      .dimn    { font: 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
      .cap     { font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--sig); letter-spacing: 0.12em; }
      .dim-cap { font: 600 9.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); letter-spacing: 0.1em; }
      .pill-t  { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .pill-ts { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--sig); }
      .inv     { font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--fill); }
      .on-sig  { fill: var(--sig); }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.8 L10,5 L0,9.2 Z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.8 L10,5 L0,9.2 Z" fill="var(--sig)"/>
    </marker>
  </defs>
  <text class="cap" x="124" y="30" text-anchor="start" xml:space="preserve">MEMORY LAYOUT (NOT TO SCALE)</text>
  <text class="cap" x="416" y="30" text-anchor="start" xml:space="preserve">SEPARATE DISPLAYS</text>
  <rect class="bxq" x="124" y="48" width="208" height="46" rx="0"/>
  <text class="nb" x="228" y="69" text-anchor="middle" xml:space="preserve">TEC-OS ROM</text>
  <text class="dimn" x="228" y="86" text-anchor="middle" xml:space="preserve">Read-only · 16 KB</text>
  <rect class="bx" x="124" y="150" width="208" height="66" rx="0"/>
  <text class="nb" x="228" y="179" text-anchor="middle" xml:space="preserve">Program (TPA)</text>
  <text class="ns" x="228" y="198" text-anchor="middle" xml:space="preserve">Code, data and stack</text>
  <rect class="bxq" x="124" y="216" width="208" height="42" rx="0"/>
  <text class="ns" x="228" y="241" text-anchor="middle" xml:space="preserve">Page zero</text>
  <rect class="bxs" x="124" y="94" width="208" height="56" rx="0"/>
  <text class="nb on-sig" x="228" y="118" text-anchor="middle" xml:space="preserve">TBUG.SVC</text>
  <text class="ns" x="228" y="137" text-anchor="middle" xml:space="preserve">Loaded at top of RAM</text>
  <line class="tick" x1="112" y1="48" x2="124" y2="48"/>
  <text class="dim" x="104" y="52" text-anchor="end" xml:space="preserve">FFFFh</text>
  <line class="tick" x1="112" y1="94" x2="124" y2="94"/>
  <text class="dim" x="104" y="98" text-anchor="end" xml:space="preserve">C000h</text>
  <line class="sline" x1="110" y1="150" x2="124" y2="150"/>
  <text class="tb on-sig" x="104" y="154" text-anchor="end" xml:space="preserve">(0006h)</text>
  <line class="tick" x1="112" y1="216" x2="124" y2="216"/>
  <text class="dim" x="104" y="220" text-anchor="end" xml:space="preserve">0100h</text>
  <line class="tick" x1="112" y1="258" x2="124" y2="258"/>
  <text class="dim" x="104" y="262" text-anchor="end" xml:space="preserve">0000h</text>
  <path class="sline" d="M332,122 H374 V104 H414" marker-end="url(#arS)"/>
  <path class="ln" d="M332,183 H374 V200 H414" marker-end="url(#ar)"/>
  <rect class="bxs" x="416" y="62" width="264" height="84" rx="5"/>
  <text class="nb on-sig" x="434" y="90" text-anchor="start" xml:space="preserve">20 × 4 LCD</text>
  <text class="ns" x="434" y="113" text-anchor="start" xml:space="preserve">Matrix keyboard · debugger UI</text>
  <text class="t" x="434" y="132" text-anchor="start" xml:space="preserve">&gt;PC 0100   SP 98FE</text>
  <rect class="bx" x="416" y="162" width="264" height="76" rx="5"/>
  <text class="nb" x="434" y="190" text-anchor="start" xml:space="preserve">Console</text>
  <text class="ns" x="434" y="213" text-anchor="start" xml:space="preserve">Default display · program I/O</text>
  <text class="dimn" x="40" y="298" text-anchor="start" xml:space="preserve">TBUG loads at the top of RAM, below the ROM. Program memory ends where TBUG begins (0006h).</text>
</svg>
