<svg xmlns="http://www.w3.org/2000/svg" width="720" height="354" viewBox="0 0 720 354" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Following HL across the FILL.COM buffer in Memory</title>
  <desc id="figDesc">In FILL.COM, opening Memory via Enter on HL locks the display to HL at 010Ah. When LD (HL),B writes 04h and INC HL advances HL to 010Bh, Memory moves to 010Bh automatically. Scrolling away appends + (HL+). Editing with E writes only from 0100h up to the lowest resident service.</desc>
  <defs>
    <style>
      :root {
        --ink:    #111417;
        --ink-2:  #3a4148;
        --dim:    #656d75;
        --rule:   #d0d4d8;
        --fill:   #ffffff;
        --fill-2: #f1f3f2;
        --sig:    #236c4a;
        --sig-bg: #eef6f1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink:    #e8ecea;
          --ink-2:  #b5beb9;
          --dim:    #828d87;
          --rule:   #38403c;
          --fill:   #1c1f22;
          --fill-2: #24292c;
          --sig:    #6ec996;
          --sig-bg: #182b22;
        }
      }

      .bx      { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.4; }
      .bxq     { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.3; }
      .bxs     { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 1.9; }
      .pill    { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.1; }
      .pill-s  { fill: var(--fill);   stroke: var(--sig);  stroke-width: 1.2; }
      .sig-dot { fill: var(--sig);    stroke: none; }
      .ink-dot { fill: var(--ink);    stroke: none; }

      .rule    { fill: none; stroke: var(--rule); stroke-width: 1; }
      .tick    { fill: none; stroke: var(--dim);  stroke-width: 1; }
      .ln      { fill: none; stroke: var(--ink);  stroke-width: 1.4; }
      .sline   { fill: none; stroke: var(--sig);  stroke-width: 1.8; }
      .dash    { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }

      .t       { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .tb      { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .ts      { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
      .nb      { font: 600 13.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
      .ns      { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
      .dim     { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
      .dimn    { font: 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
      .cap     { font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--sig); letter-spacing: 0.12em; }
      .dim-cap { font: 600 9.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); letter-spacing: 0.1em; }
      .pill-t  { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .pill-ts { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--sig); }
      .inv     { font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--fill); }
      .on-sig  { fill: var(--sig); }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.8 L10,5 L0,9.2 Z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.8 L10,5 L0,9.2 Z" fill="var(--sig)"/>
    </marker>
  </defs>
  <text class="cap" x="40" y="30" text-anchor="start" xml:space="preserve">AFTER LD (HL),B · LOCKED TO HL</text>
  <text class="cap" x="416" y="30" text-anchor="start" xml:space="preserve">AFTER INC HL · WINDOW ADVANCES</text>
  <text class="dim" x="139" y="57" text-anchor="middle" xml:space="preserve">010B</text>
  <rect class="bx" x="106" y="66" width="66" height="40" rx="0"/>
  <text class="t" x="139" y="90.5" text-anchor="middle" xml:space="preserve">00</text>
  <text class="dim" x="205" y="57" text-anchor="middle" xml:space="preserve">010C</text>
  <rect class="bx" x="172" y="66" width="66" height="40" rx="0"/>
  <text class="t" x="205" y="90.5" text-anchor="middle" xml:space="preserve">00</text>
  <text class="dim" x="271" y="57" text-anchor="middle" xml:space="preserve">010D</text>
  <rect class="bx" x="238" y="66" width="66" height="40" rx="0"/>
  <text class="t" x="271" y="90.5" text-anchor="middle" xml:space="preserve">00</text>
  <text class="dim on-sig" x="73" y="57" text-anchor="middle" xml:space="preserve">010A</text>
  <rect class="bxs" x="40" y="66" width="66" height="40" rx="0"/>
  <text class="tb on-sig" x="73" y="90.5" text-anchor="middle" xml:space="preserve">04</text>
  <text class="tb on-sig" x="172" y="132" text-anchor="middle" xml:space="preserve">010A&gt;04 00 00 00 HL</text>
  <text class="dim" x="360" y="74" text-anchor="middle" xml:space="preserve">INC HL</text>
  <line class="sline" x1="318" y1="86" x2="402" y2="86" marker-end="url(#arS)"/>
  <text class="dim" x="515" y="57" text-anchor="middle" xml:space="preserve">010C</text>
  <rect class="bx" x="482" y="66" width="66" height="40" rx="0"/>
  <text class="t" x="515" y="90.5" text-anchor="middle" xml:space="preserve">00</text>
  <text class="dim" x="581" y="57" text-anchor="middle" xml:space="preserve">010D</text>
  <rect class="bx" x="548" y="66" width="66" height="40" rx="0"/>
  <text class="t" x="581" y="90.5" text-anchor="middle" xml:space="preserve">00</text>
  <text class="dim" x="647" y="57" text-anchor="middle" xml:space="preserve">010E</text>
  <rect class="bx" x="614" y="66" width="66" height="40" rx="0"/>
  <text class="t" x="647" y="90.5" text-anchor="middle" xml:space="preserve">00</text>
  <text class="dim on-sig" x="449" y="57" text-anchor="middle" xml:space="preserve">010B</text>
  <rect class="bxs" x="416" y="66" width="66" height="40" rx="0"/>
  <text class="tb on-sig" x="449" y="90.5" text-anchor="middle" xml:space="preserve">00</text>
  <text class="tb on-sig" x="548" y="132" text-anchor="middle" xml:space="preserve">010B&gt;00 00 00 00 HL</text>
  <line class="rule" x1="40" y1="158" x2="680" y2="158"/>
  <text class="cap" x="40" y="184" text-anchor="start" xml:space="preserve">WRITABLE RANGE FOR E (EDIT MODE)</text>
  <rect class="bxq" x="40" y="202" width="122" height="62" rx="0"/>
  <text class="ns" x="101" y="228" text-anchor="middle" xml:space="preserve">Page zero</text>
  <text class="dim" x="101" y="248" text-anchor="middle" xml:space="preserve">0000h–00FFh</text>
  <rect class="bxq" x="518" y="202" width="162" height="62" rx="0"/>
  <text class="ns" x="599" y="228" text-anchor="middle" xml:space="preserve">TBUG / ROM</text>
  <text class="dim" x="599" y="248" text-anchor="middle" xml:space="preserve">Protected</text>
  <rect class="bxs" x="162" y="202" width="356" height="62" rx="0"/>
  <text class="nb on-sig" x="340" y="228" text-anchor="middle" xml:space="preserve">Writable with E (0100h to lowest service)</text>
  <text class="ns" x="340" y="248" text-anchor="middle" xml:space="preserve">Program code, data and stack · EDT mode</text>
  <text class="dimn" x="40" y="298" text-anchor="start" xml:space="preserve">Scrolling away from a followed register appends + (HL+). Opening via M, Tab or G uses FIX.</text>
  <text class="dimn" x="40" y="320" text-anchor="start" xml:space="preserve">Editing refuses addresses below 0100h or inside resident services so TBUG stays intact.</text>
</svg>
