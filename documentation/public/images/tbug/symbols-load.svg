<svg xmlns="http://www.w3.org/2000/svg" width="720" height="312" viewBox="0 0 720 312" role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">Automatic symbol loading from NAME.TBG inside TBUG.SVC</title>
  <desc id="figDesc">TAS writes NAME.TBG beside NAME.COM. When TBUG.SVC stops a program at launch, its built-in symbol loader checks NAME.TBG against the image end address and 16-bit checksum. A match lights up SY on Registers, shows labels in Code and enables the Symbols view on Y.</desc>
  <defs>
    <style>
      :root {
        --ink:    #111417;
        --ink-2:  #3a4148;
        --dim:    #656d75;
        --rule:   #d0d4d8;
        --fill:   #ffffff;
        --fill-2: #f1f3f2;
        --sig:    #236c4a;
        --sig-bg: #eef6f1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink:    #e8ecea;
          --ink-2:  #b5beb9;
          --dim:    #828d87;
          --rule:   #38403c;
          --fill:   #1c1f22;
          --fill-2: #24292c;
          --sig:    #6ec996;
          --sig-bg: #182b22;
        }
      }

      .bx      { fill: var(--fill);   stroke: var(--ink);  stroke-width: 1.4; }
      .bxq     { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.3; }
      .bxs     { fill: var(--sig-bg); stroke: var(--sig);  stroke-width: 1.9; }
      .pill    { fill: var(--fill-2); stroke: var(--rule); stroke-width: 1.1; }
      .pill-s  { fill: var(--fill);   stroke: var(--sig);  stroke-width: 1.2; }
      .sig-dot { fill: var(--sig);    stroke: none; }
      .ink-dot { fill: var(--ink);    stroke: none; }

      .rule    { fill: none; stroke: var(--rule); stroke-width: 1; }
      .tick    { fill: none; stroke: var(--dim);  stroke-width: 1; }
      .ln      { fill: none; stroke: var(--ink);  stroke-width: 1.4; }
      .sline   { fill: none; stroke: var(--sig);  stroke-width: 1.8; }
      .dash    { fill: none; stroke: var(--dim);  stroke-width: 1.2; stroke-dasharray: 4 3; }

      .t       { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .tb      { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .ts      { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
      .nb      { font: 600 13.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
      .ns      { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink-2); }
      .dim     { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); }
      .dimn    { font: 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--dim); }
      .cap     { font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--sig); letter-spacing: 0.12em; }
      .dim-cap { font: 600 9.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--dim); letter-spacing: 0.1em; }
      .pill-t  { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink); }
      .pill-ts { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--sig); }
      .inv     { font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--fill); }
      .on-sig  { fill: var(--sig); }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.8 L10,5 L0,9.2 Z" fill="var(--ink)"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0.8 L10,5 L0,9.2 Z" fill="var(--sig)"/>
    </marker>
  </defs>
  <text class="cap" x="40" y="30" text-anchor="start" xml:space="preserve">AUTOMATIC SYMBOL LOADING · BUILT INTO TBUG.SVC</text>
  <rect class="bx" x="40" y="46" width="190" height="96" rx="5"/>
  <circle class="ink-dot" cx="68" cy="71" r="10"/>
  <text class="inv" x="68" y="75" text-anchor="middle" xml:space="preserve">1</text>
  <text class="nb" x="86" y="75.5" text-anchor="start" xml:space="preserve">Assemble</text>
  <text class="t" x="58" y="100" text-anchor="start" xml:space="preserve">Writes NAME.COM</text>
  <text class="t" x="58" y="120" text-anchor="start" xml:space="preserve">Writes NAME.TBG</text>
  <line class="ln" x1="230" y1="94" x2="261" y2="94" marker-end="url(#ar)"/>
  <rect class="bx" x="265" y="46" width="190" height="96" rx="5"/>
  <circle class="ink-dot" cx="293" cy="71" r="10"/>
  <text class="inv" x="293" y="75" text-anchor="middle" xml:space="preserve">2</text>
  <text class="nb" x="311" y="75.5" text-anchor="start" xml:space="preserve">Launch in TBUG</text>
  <text class="ns" x="283" y="100" text-anchor="start" xml:space="preserve">Checks image end</text>
  <text class="ns" x="283" y="120" text-anchor="start" xml:space="preserve">Checks 16-bit sum</text>
  <line class="ln" x1="455" y1="94" x2="486" y2="94" marker-end="url(#ar)"/>
  <rect class="bxs" x="490" y="46" width="190" height="96" rx="5"/>
  <circle class="sig-dot" cx="518" cy="71" r="10"/>
  <text class="inv" x="518" y="75" text-anchor="middle" xml:space="preserve">3</text>
  <text class="nb on-sig" x="536" y="75.5" text-anchor="start" xml:space="preserve">Symbols active</text>
  <text class="ns" x="508" y="100" text-anchor="start" xml:space="preserve">SY flag · Code labels</text>
  <text class="ns" x="508" y="120" text-anchor="start" xml:space="preserve">Symbols view on Y</text>
  <rect class="bxq" x="40" y="172" width="640" height="88" rx="5"/>
  <text class="cap" x="60" y="198" text-anchor="start" xml:space="preserve">MISSING OR STALE NAME.TBG</text>
  <text class="ns" x="60" y="222" text-anchor="start" xml:space="preserve">TBUG ignores a missing or mismatched file quietly and debugs in raw hex.</text>
  <text class="ns" x="60" y="242" text-anchor="start" xml:space="preserve">Reassemble with TAS to write a fresh matching NAME.COM and NAME.TBG pair.</text>
  <text class="dimn" x="40" y="292" text-anchor="start" xml:space="preserve">Symbol support is built into TBUG.SVC and loads automatically with no extra service.</text>
</svg>
