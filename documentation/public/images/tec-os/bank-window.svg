<svg xmlns="http://www.w3.org/2000/svg" width="720" height="288" viewBox="0 0 720 288" role="img" aria-labelledby="title desc">
<title id="title">Two RAM banks at the same CPU addresses</title>
<desc id="desc">Both views have fixed RAM at 0000h–7FFFh and ROM at C000h–FFFFh. Latch bit 2 selects which 16 KiB half of U9 appears at 8000h–BFFFh: EXPAND 0 for ordinary upper RAM or EXPAND 1 for the cache. A stack in EXPAND 0 is hidden in the cache view.</desc>
<defs><style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48;--paper:#fff}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd;--paper:#1c1f22}}
rect {fill:var(--panel);stroke:var(--edge);stroke-width:1.3}
text {fill:currentColor;font:14px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 16px system-ui,sans-serif}
.note {font:14px system-ui,sans-serif}
.accent {fill:var(--accent);font-weight:bold}
.arrow {fill:none;stroke:var(--accent);stroke-width:1.6}
.highlight {stroke:var(--accent);stroke-width:2.5}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<text class="head" x="246" y="28" text-anchor="middle" xml:space="preserve">Normal view · EXPAND 0</text>
<text class="head" x="562" y="28" text-anchor="middle" xml:space="preserve">Cache view · EXPAND 1</text>
<rect class="" x="108" y="46" width="276" height="43" rx="4"/>
<text class="" x="246" y="73" text-anchor="middle" xml:space="preserve">C000h–FFFFh · ROM</text>
<rect class="highlight" x="108" y="89" width="276" height="83" rx="4"/>
<rect class="" x="108" y="172" width="276" height="54" rx="4"/>
<text class="" x="246" y="204" text-anchor="middle" xml:space="preserve">0000h–7FFFh · fixed RAM</text>
<rect class="" x="424" y="46" width="276" height="43" rx="4"/>
<text class="" x="562" y="73" text-anchor="middle" xml:space="preserve">C000h–FFFFh · ROM</text>
<rect class="highlight" x="424" y="89" width="276" height="83" rx="4"/>
<rect class="" x="424" y="172" width="276" height="54" rx="4"/>
<text class="" x="562" y="204" text-anchor="middle" xml:space="preserve">0000h–7FFFh · fixed RAM</text>
<text class="" x="246" y="119" text-anchor="middle" xml:space="preserve">8000h–BFFFh</text>
<text class="head" x="246" y="148" text-anchor="middle" xml:space="preserve">Upper RAM / stacks</text>
<text class="" x="562" y="119" text-anchor="middle" xml:space="preserve">8000h–BFFFh</text>
<text class="head" x="562" y="148" text-anchor="middle" xml:space="preserve">Block cache</text>
<text class="note" x="360" y="252" text-anchor="middle" xml:space="preserve">Latch bit 2 selects the window. Fixed RAM and ROM stay visible.</text>
<text class="note" x="360" y="277" text-anchor="middle" xml:space="preserve">An EXPAND 0 stack is hidden while EXPAND 1 is selected.</text>
</svg>
