<svg xmlns="http://www.w3.org/2000/svg" width="720" height="178" viewBox="0 0 720 178" role="img" aria-labelledby="title desc">
<title id="title">A program uses the BDOS and BIOS</title>
<desc id="desc">A COM program passes a function number in C and calls 0005h. BDOS console and disk routines use RAM BIOS entries. Those entries reach device routines or installed hooks. Numbered hardware services are a separate interface.</desc>
<defs><style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48;--paper:#fff}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd;--paper:#1c1f22}}
rect {fill:var(--panel);stroke:var(--edge);stroke-width:1.3}
text {fill:currentColor;font:14px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 16px system-ui,sans-serif}
.note {font:14px system-ui,sans-serif}
.accent {fill:var(--accent);font-weight:bold}
.arrow {fill:none;stroke:var(--accent);stroke-width:1.6}
.highlight {stroke:var(--accent);stroke-width:2.5}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<rect class="" x="24" y="20" width="200" height="88" rx="4"/>
<text class="head" x="124" y="46" text-anchor="middle" xml:space="preserve">COM program</text>
<text class="" x="124" y="71" text-anchor="middle" xml:space="preserve">C = function</text>
<text class="" x="124" y="90" text-anchor="middle" xml:space="preserve">CALL 0005h</text>
<path class="arrow" d="M226 64 L254 64" marker-end="url(#arrow)"/>
<rect class="" x="260" y="20" width="200" height="88" rx="4"/>
<text class="head" x="360" y="46" text-anchor="middle" xml:space="preserve">BDOS in ROM</text>
<text class="" x="360" y="71" text-anchor="middle" xml:space="preserve">Console / files</text>
<text class="" x="360" y="90" text-anchor="middle" xml:space="preserve">RAM BIOS entries</text>
<path class="arrow" d="M462 64 L490 64" marker-end="url(#arrow)"/>
<rect class="" x="496" y="20" width="200" height="88" rx="4"/>
<text class="head" x="596" y="46" text-anchor="middle" xml:space="preserve">BIOS device path</text>
<text class="" x="596" y="71" text-anchor="middle" xml:space="preserve">Device routines</text>
<text class="" x="596" y="90" text-anchor="middle" xml:space="preserve">Or installed hooks</text>

<text class="note" x="360" y="140" text-anchor="middle" xml:space="preserve">For example: print a character, or read a file record.</text>
<text class="note" x="360" y="162" text-anchor="middle" xml:space="preserve">Numbered hardware services have a separate entry interface.</text>
</svg>
