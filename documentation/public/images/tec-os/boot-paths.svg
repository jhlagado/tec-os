<svg xmlns="http://www.w3.org/2000/svg" width="720" height="355" viewBox="0 0 720 355" role="img" aria-labelledby="title desc">
<title id="title">Cold boot and warm boot have different lifetimes</title>
<desc id="desc">Abbreviated paths: reset starts cold boot with a fixed-RAM stack, saved-selection checks and RAM tests. Initialisation clears workspace and cache and mounts the card before command processing. Warm boot restores the normal bank, rebuilds page zero, resets BDOS state and attempts pending writes, retaining installed services and failed acknowledged data.</desc>
<defs><style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48;--paper:#fff}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd;--paper:#1c1f22}}
rect {fill:var(--panel);stroke:var(--edge);stroke-width:1.3}
text {fill:currentColor;font:14px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 16px system-ui,sans-serif}
.note {font:14px system-ui,sans-serif}
.accent {fill:var(--accent);font-weight:bold}
.arrow {fill:none;stroke:var(--accent);stroke-width:1.6}
.highlight {stroke:var(--accent);stroke-width:2.5}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<text class="head" x="185" y="29" text-anchor="middle" xml:space="preserve">Reset / cold boot</text>
<text class="head" x="535" y="29" text-anchor="middle" xml:space="preserve">Program exit / warm boot</text>
<rect class="" x="35" y="45" width="300" height="88" rx="4"/>
<text class="head" x="185" y="71" text-anchor="middle" xml:space="preserve">Establish early state</text>
<text class="" x="185" y="96" text-anchor="middle" xml:space="preserve">Fixed-RAM stack</text>
<text class="" x="185" y="115" text-anchor="middle" xml:space="preserve">Capture selection; test RAM</text>
<rect class="" x="385" y="45" width="300" height="88" rx="4"/>
<text class="head" x="535" y="71" text-anchor="middle" xml:space="preserve">Restore normal bank</text>
<text class="" x="535" y="96" text-anchor="middle" xml:space="preserve">EXPAND 0 and BIOS stack</text>
<text class="" x="535" y="115" text-anchor="middle" xml:space="preserve">Page zero; reset BDOS</text>
<path class="arrow" d="M185 138 L185 156" marker-end="url(#arrow)"/>
<path class="arrow" d="M535 138 L535 156" marker-end="url(#arrow)"/>
<rect class="" x="35" y="163" width="300" height="88" rx="4"/>
<text class="head" x="185" y="189" text-anchor="middle" xml:space="preserve">Initialise the machine</text>
<text class="" x="185" y="214" text-anchor="middle" xml:space="preserve">Clear workspace and cache</text>
<text class="" x="185" y="233" text-anchor="middle" xml:space="preserve">Console, card and vectors</text>
<rect class="" x="385" y="163" width="300" height="88" rx="4"/>
<text class="head" x="535" y="189" text-anchor="middle" xml:space="preserve">Attempt pending writes</text>
<text class="" x="535" y="214" text-anchor="middle" xml:space="preserve">Bounded flush</text>
<text class="" x="535" y="233" text-anchor="middle" xml:space="preserve">Retain failed data</text>
<path class="arrow" d="M185 256 L185 274" marker-end="url(#arrow)"/>
<path class="arrow" d="M535 256 L535 274" marker-end="url(#arrow)"/>
<text class="" x="185" y="294" text-anchor="middle" xml:space="preserve">Command processing / startup</text>
<text class="" x="535" y="294" text-anchor="middle" xml:space="preserve">Command processing resumes</text>
<text class="note" x="360" y="324" text-anchor="middle" xml:space="preserve">Warm boot normally retains installed services and command state.</text>
<text class="note" x="360" y="346" text-anchor="middle" xml:space="preserve">Sequences abbreviated. Failed writes can cancel the remaining command line.</text>
</svg>
