<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336" role="img" aria-labelledby="title desc">
<title id="title">Queued data and directory publication</title>
<desc id="desc">Writes to the same 512-byte cache line combine there while it is dirty. A cooperative OS-call opportunity attempts eligible queued data. Failed acknowledged data stays queued. Directory publication follows its data prerequisites; a rejected unpublished directory image is dropped rather than retried later. This is not a timed durability guarantee.</desc>
<defs><style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48;--paper:#fff}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd;--paper:#1c1f22}}
rect {fill:var(--panel);stroke:var(--edge);stroke-width:1.3}
text {fill:currentColor;font:14px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 16px system-ui,sans-serif}
.note {font:14px system-ui,sans-serif}
.accent {fill:var(--accent);font-weight:bold}
.arrow {fill:none;stroke:var(--accent);stroke-width:1.6}
.highlight {stroke:var(--accent);stroke-width:2.5}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<rect class="" x="24" y="20" width="200" height="88" rx="4"/>
<text class="head" x="124" y="46" text-anchor="middle" xml:space="preserve">Record writes</text>
<text class="" x="124" y="71" text-anchor="middle" xml:space="preserve">Merge into one</text>
<text class="" x="124" y="90" text-anchor="middle" xml:space="preserve">512-byte cache line</text>
<path class="arrow" d="M226 64 L254 64" marker-end="url(#arrow)"/>
<rect class="" x="260" y="20" width="200" height="88" rx="4"/>
<text class="head" x="360" y="46" text-anchor="middle" xml:space="preserve">First-dirty queue</text>
<text class="" x="360" y="71" text-anchor="middle" xml:space="preserve">Coalesce updates</text>
<text class="" x="360" y="90" text-anchor="middle" xml:space="preserve">Keep queue position</text>
<path class="arrow" d="M462 64 L490 64" marker-end="url(#arrow)"/>
<rect class="" x="496" y="20" width="200" height="88" rx="4"/>
<text class="head" x="596" y="46" text-anchor="middle" xml:space="preserve">OS-call opportunity</text>
<text class="" x="596" y="71" text-anchor="middle" xml:space="preserve">Bounded write work</text>
<text class="" x="596" y="90" text-anchor="middle" xml:space="preserve">Success: line clean</text>

<text class="note" x="360" y="140" text-anchor="middle" xml:space="preserve">A failed acknowledged data write stays dirty for another attempt.</text>
<rect class="" x="24" y="170" width="200" height="88" rx="4"/>
<text class="head" x="124" y="196" text-anchor="middle" xml:space="preserve">Data prerequisites</text>
<text class="" x="124" y="221" text-anchor="middle" xml:space="preserve">Write data first</text>
<text class="" x="124" y="240" text-anchor="middle" xml:space="preserve">Require success</text>
<path class="arrow" d="M226 214 L254 214" marker-end="url(#arrow)"/>
<rect class="" x="260" y="170" width="200" height="88" rx="4"/>
<text class="head" x="360" y="196" text-anchor="middle" xml:space="preserve">Write directory</text>
<text class="" x="360" y="221" text-anchor="middle" xml:space="preserve">Publish file metadata</text>
<text class="" x="360" y="240" text-anchor="middle" xml:space="preserve">After prerequisites</text>
<path class="arrow" d="M462 214 L490 214" marker-end="url(#arrow)"/>
<rect class="" x="496" y="170" width="200" height="88" rx="4"/>
<text class="head" x="596" y="196" text-anchor="middle" xml:space="preserve">Published metadata</text>
<text class="" x="596" y="221" text-anchor="middle" xml:space="preserve">Successful update</text>
<text class="" x="596" y="240" text-anchor="middle" xml:space="preserve">Names stored file data</text>

<text class="note" x="360" y="288" text-anchor="middle" xml:space="preserve">Failure of either write step drops the unpublished directory image.</text>
<text class="note" x="360" y="315" text-anchor="middle" xml:space="preserve">Cooperative work has no clock deadline and provides no rollback.</text>
</svg>
