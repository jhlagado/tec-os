<svg xmlns="http://www.w3.org/2000/svg" width="720" height="218" viewBox="0 0 720 218" role="img" aria-labelledby="title desc">
<title id="title">Conditional continuation after warm boot</title>
<desc id="desc">For TAS BANNER &amp; BANNER ! DIR, the shell tests TAS’s result before BANNER. A failing result skips BANNER, while DIR after the unconditional separator still runs. Warm boot normally preserves the pending line and result; explicit cancellation or failed-flush recovery can discard the remainder.</desc>
<defs><style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48;--paper:#fff}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd;--paper:#1c1f22}}
rect {fill:var(--panel);stroke:var(--edge);stroke-width:1.3}
text {fill:currentColor;font:14px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 16px system-ui,sans-serif}
.note {font:14px system-ui,sans-serif}
.accent {fill:var(--accent);font-weight:bold}
.arrow {fill:none;stroke:var(--accent);stroke-width:1.6}
.highlight {stroke:var(--accent);stroke-width:2.5}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<text class="head" x="360" y="30" text-anchor="middle" xml:space="preserve">TAS BANNER &amp; BANNER ! DIR</text>
<rect class="" x="24" y="53" width="200" height="88" rx="4"/>
<text class="head" x="124" y="79" text-anchor="middle" xml:space="preserve">TAS BANNER</text>
<text class="" x="124" y="104" text-anchor="middle" xml:space="preserve">Run the assembler</text>
<text class="" x="124" y="123" text-anchor="middle" xml:space="preserve">Retain result on exit</text>
<path class="arrow" d="M226 97 L254 97" marker-end="url(#arrow)"/>
<rect class="" x="260" y="53" width="200" height="88" rx="4"/>
<text class="head" x="360" y="79" text-anchor="middle" xml:space="preserve">&amp; BANNER</text>
<text class="" x="360" y="104" text-anchor="middle" xml:space="preserve">Run on success</text>
<text class="" x="360" y="123" text-anchor="middle" xml:space="preserve">Skip on failure</text>
<path class="arrow" d="M462 97 L490 97" marker-end="url(#arrow)"/>
<rect class="" x="496" y="53" width="200" height="88" rx="4"/>
<text class="head" x="596" y="79" text-anchor="middle" xml:space="preserve">! DIR</text>
<text class="" x="596" y="104" text-anchor="middle" xml:space="preserve">Run regardless of</text>
<text class="" x="596" y="123" text-anchor="middle" xml:space="preserve">The earlier result</text>

<text class="note" x="360" y="173" text-anchor="middle" xml:space="preserve">The shell tests the previous result before starting the next piece.</text>
<text class="note" x="360" y="199" text-anchor="middle" xml:space="preserve">Cancellation or failed-flush recovery can discard the remaining line.</text>
</svg>
