<svg xmlns="http://www.w3.org/2000/svg" width="720" height="292" viewBox="0 0 720 292" role="img" aria-labelledby="title desc">
<title id="title">Drive letters and volumes on one card</title>
<desc id="desc">The starter card has SYSTEM, WORK, PROJECTS, GAMES and SPARE. Initially A maps SYSTEM, B maps WORK, C maps PROJECTS and D is empty. CD D:GAMES assigns the existing GAMES volume to D.</desc>
<defs><style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48;--paper:#fff}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd;--paper:#1c1f22}}
rect {fill:var(--panel);stroke:var(--edge);stroke-width:1.3}
text {fill:currentColor;font:14px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 16px system-ui,sans-serif}
.note {font:14px system-ui,sans-serif}
.accent {fill:var(--accent);font-weight:bold}
.arrow {fill:none;stroke:var(--accent);stroke-width:1.6}
.highlight {stroke:var(--accent);stroke-width:2.5}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<rect class="" x="24" y="16" width="302" height="252" rx="4"/>
<text class="head" x="175" y="43" text-anchor="middle" xml:space="preserve">Volumes in one card container</text>
<text class="" x="58" y="78" text-anchor="start" xml:space="preserve">SYSTEM</text>
<text class="" x="58" y="115" text-anchor="start" xml:space="preserve">WORK</text>
<text class="" x="58" y="152" text-anchor="start" xml:space="preserve">PROJECTS</text>
<text class="" x="58" y="189" text-anchor="start" xml:space="preserve">GAMES</text>
<text class="" x="58" y="226" text-anchor="start" xml:space="preserve">SPARE</text>
<rect class="" x="442" y="54" width="254" height="36" rx="4"/>
<text class="head" x="569" y="80" text-anchor="middle" xml:space="preserve">A: SYSTEM</text>
<path class="arrow" d="M199 73 L434 72" marker-end="url(#arrow)"/>
<rect class="" x="442" y="103" width="254" height="36" rx="4"/>
<text class="head" x="569" y="129" text-anchor="middle" xml:space="preserve">B: WORK</text>
<path class="arrow" d="M199 110 L434 121" marker-end="url(#arrow)"/>
<rect class="" x="442" y="152" width="254" height="36" rx="4"/>
<text class="head" x="569" y="178" text-anchor="middle" xml:space="preserve">C: PROJECTS</text>
<path class="arrow" d="M199 147 L434 170" marker-end="url(#arrow)"/>
<rect class="" x="442" y="201" width="254" height="36" rx="4"/>
<text class="head" x="569" y="227" text-anchor="middle" xml:space="preserve">D: GAMES</text>
<path class="arrow" d="M199 184 L434 219" marker-end="url(#arrow)"/>
<text class="head" x="442" y="34" text-anchor="start" xml:space="preserve">After CD D:GAMES</text>
<text class="note" x="360" y="287" text-anchor="middle" xml:space="preserve">SPARE remains unassigned. The files stay inside their volumes.</text>
</svg>
