<svg xmlns="http://www.w3.org/2000/svg" width="720" height="251" viewBox="0 0 720 251" role="img" aria-labelledby="title desc">
<title id="title">Model evidence and physical-board evidence</title>
<desc id="desc">One route runs pinned ROM and inputs in the Debug80 model to collect transcripts, assertions and T-states. A separate route runs diagnostics on an identified physical board and records its actual devices and results. A model pass establishes the exercised model behaviour, not an unperformed board test.</desc>
<defs><style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48;--paper:#fff}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd;--paper:#1c1f22}}
rect {fill:var(--panel);stroke:var(--edge);stroke-width:1.3}
text {fill:currentColor;font:14px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 16px system-ui,sans-serif}
.note {font:14px system-ui,sans-serif}
.accent {fill:var(--accent);font-weight:bold}
.arrow {fill:none;stroke:var(--accent);stroke-width:1.6}
.highlight {stroke:var(--accent);stroke-width:2.5}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<text class="head" x="185" y="28" text-anchor="middle" xml:space="preserve">Software-model route</text>
<text class="head" x="535" y="28" text-anchor="middle" xml:space="preserve">Physical-board route</text>
<rect class="" x="35" y="44" width="300" height="88" rx="4"/>
<text class="head" x="185" y="70" text-anchor="middle" xml:space="preserve">Pinned ROM and inputs</text>
<text class="" x="185" y="95" text-anchor="middle" xml:space="preserve">Debug80 runtime</text>
<text class="" x="185" y="114" text-anchor="middle" xml:space="preserve">Reproducible workload</text>
<rect class="" x="385" y="44" width="300" height="88" rx="4"/>
<text class="head" x="535" y="70" text-anchor="middle" xml:space="preserve">Identified board and card</text>
<text class="" x="535" y="95" text-anchor="middle" xml:space="preserve">Actual hardware</text>
<text class="" x="535" y="114" text-anchor="middle" xml:space="preserve">Diagnostic workload</text>
<path class="arrow" d="M185 138 L185 158" marker-end="url(#arrow)"/>
<path class="arrow" d="M535 138 L535 158" marker-end="url(#arrow)"/>
<text class="" x="185" y="183" text-anchor="middle" xml:space="preserve">Transcript / assertions / T-states</text>
<text class="" x="535" y="183" text-anchor="middle" xml:space="preserve">Board log / device observations</text>
<text class="note" x="360" y="220" text-anchor="middle" xml:space="preserve">Each result applies to its recorded artifact, setup and exercised paths.</text>
<text class="note" x="360" y="243" text-anchor="middle" xml:space="preserve">A model pass does not establish physical-board behaviour.</text>
</svg>
