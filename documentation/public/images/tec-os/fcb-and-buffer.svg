<svg xmlns="http://www.w3.org/2000/svg" width="720" height="246" viewBox="0 0 720 246" role="img" aria-labelledby="title desc">
<title id="title">File state and transferred bytes</title>
<desc id="desc">The FCB describes the file and sequential position. Function 26 selects the DMA buffer. Function 20 reads a 128-byte record there and advances the FCB position on success. The default buffer at 0080h overlaps the command tail.</desc>
<defs><style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48;--paper:#fff}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd;--paper:#1c1f22}}
rect {fill:var(--panel);stroke:var(--edge);stroke-width:1.3}
text {fill:currentColor;font:14px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 16px system-ui,sans-serif}
.note {font:14px system-ui,sans-serif}
.accent {fill:var(--accent);font-weight:bold}
.arrow {fill:none;stroke:var(--accent);stroke-width:1.6}
.highlight {stroke:var(--accent);stroke-width:2.5}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<rect class="" x="24" y="22" width="200" height="88" rx="4"/>
<text class="head" x="124" y="48" text-anchor="middle" xml:space="preserve">File control block</text>
<text class="" x="124" y="73" text-anchor="middle" xml:space="preserve">Name / allocation</text>
<text class="" x="124" y="92" text-anchor="middle" xml:space="preserve">Sequential position</text>
<rect class="" x="260" y="22" width="200" height="88" rx="4"/>
<text class="head" x="360" y="48" text-anchor="middle" xml:space="preserve">BDOS function 20</text>
<text class="" x="360" y="73" text-anchor="middle" xml:space="preserve">DE = FCB address</text>
<text class="" x="360" y="92" text-anchor="middle" xml:space="preserve">Read next record</text>
<rect class="" x="496" y="22" width="200" height="88" rx="4"/>
<text class="head" x="596" y="48" text-anchor="middle" xml:space="preserve">DMA buffer</text>
<text class="" x="596" y="73" text-anchor="middle" xml:space="preserve">128 data bytes</text>
<text class="" x="596" y="92" text-anchor="middle" xml:space="preserve">Default: 0080h</text>
<path class="arrow" d="M226 66 L254 66" marker-end="url(#arrow)"/>
<path class="arrow" d="M462 66 L490 66" marker-end="url(#arrow)"/>
<text class="note" x="360" y="145" text-anchor="middle" xml:space="preserve">Function 26 sets the DMA address from DE.</text>
<text class="note" x="360" y="174" text-anchor="middle" xml:space="preserve">A successful read supplies new buffer data and advances the FCB.</text>
<text class="note" x="360" y="201" text-anchor="middle" xml:space="preserve">Copy needed command-tail text before using the default buffer.</text>
<text class="note" x="360" y="228" text-anchor="middle" xml:space="preserve">An unsuccessful read does not supply valid new data.</text>
</svg>
