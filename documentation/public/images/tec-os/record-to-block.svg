<svg xmlns="http://www.w3.org/2000/svg" width="720" height="258" viewBox="0 0 720 258" role="img" aria-labelledby="title desc">
<title id="title">A CP/M record inside an SD block</title>
<desc id="desc">Track 2 and sector 5 produce record 133: 2 times 64 plus 5. Dividing by four gives block offset 33 and slot 1. A volume beginning at block 2048 therefore uses SD block 2081, with the record in bytes 128–255 of its 512 bytes.</desc>
<defs><style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48;--paper:#fff}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd;--paper:#1c1f22}}
rect {fill:var(--panel);stroke:var(--edge);stroke-width:1.3}
text {fill:currentColor;font:14px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 16px system-ui,sans-serif}
.note {font:14px system-ui,sans-serif}
.accent {fill:var(--accent);font-weight:bold}
.arrow {fill:none;stroke:var(--accent);stroke-width:1.6}
.highlight {stroke:var(--accent);stroke-width:2.5}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<rect class="" x="24" y="18" width="200" height="88" rx="4"/>
<text class="head" x="124" y="44" text-anchor="middle" xml:space="preserve">Logical position</text>
<text class="" x="124" y="69" text-anchor="middle" xml:space="preserve">Track 2, sector 5</text>
<text class="" x="124" y="88" text-anchor="middle" xml:space="preserve">2 × 64 + 5 = 133</text>
<path class="arrow" d="M226 62 L254 62" marker-end="url(#arrow)"/>
<rect class="" x="260" y="18" width="200" height="88" rx="4"/>
<text class="head" x="360" y="44" text-anchor="middle" xml:space="preserve">Record 133</text>
<text class="" x="360" y="69" text-anchor="middle" xml:space="preserve">133 ÷ 4 = 33 rem 1</text>
<text class="" x="360" y="88" text-anchor="middle" xml:space="preserve">Offset 33, slot 1</text>
<path class="arrow" d="M462 62 L490 62" marker-end="url(#arrow)"/>
<rect class="" x="496" y="18" width="200" height="88" rx="4"/>
<text class="head" x="596" y="44" text-anchor="middle" xml:space="preserve">SD block 2081</text>
<text class="" x="596" y="69" text-anchor="middle" xml:space="preserve">Volume start 2048</text>
<text class="" x="596" y="88" text-anchor="middle" xml:space="preserve">2048 + 33 = 2081</text>

<rect class="" x="64" y="142" width="148" height="54" rx="4"/>
<text class="" x="138" y="166" text-anchor="middle" xml:space="preserve">Slot 0</text>
<text class="" x="138" y="187" text-anchor="middle" xml:space="preserve">0–127</text>
<rect class="highlight" x="212" y="142" width="148" height="54" rx="4"/>
<text class="accent" x="286" y="166" text-anchor="middle" xml:space="preserve">Slot 1</text>
<text class="" x="286" y="187" text-anchor="middle" xml:space="preserve">128–255</text>
<rect class="" x="360" y="142" width="148" height="54" rx="4"/>
<text class="" x="434" y="166" text-anchor="middle" xml:space="preserve">Slot 2</text>
<text class="" x="434" y="187" text-anchor="middle" xml:space="preserve">256–383</text>
<rect class="" x="508" y="142" width="148" height="54" rx="4"/>
<text class="" x="582" y="166" text-anchor="middle" xml:space="preserve">Slot 3</text>
<text class="" x="582" y="187" text-anchor="middle" xml:space="preserve">384–511</text>
<text class="note" x="360" y="225" text-anchor="middle" xml:space="preserve">One SD transfer covers all four 128-byte record slots.</text>
<text class="note" x="360" y="247" text-anchor="middle" xml:space="preserve">The selected record occupies bytes 128–255 in this example.</text>
</svg>
