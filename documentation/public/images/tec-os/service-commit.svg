<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-labelledby="title desc">
<title id="title">Tentative service installation and final commit</title>
<desc id="desc">The service loader validates file size, dependencies and stack allowances, then applies relocation and moves the resident image tentatively. INIT runs before returned-record validation and final registry/reservation commit. Failure requires cleanup; arbitrary device or BIOS changes made by INIT are not automatically reversed.</desc>
<defs><style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48;--paper:#fff}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd;--paper:#1c1f22}}
rect {fill:var(--panel);stroke:var(--edge);stroke-width:1.3}
text {fill:currentColor;font:14px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 16px system-ui,sans-serif}
.note {font:14px system-ui,sans-serif}
.accent {fill:var(--accent);font-weight:bold}
.arrow {fill:none;stroke:var(--accent);stroke-width:1.6}
.highlight {stroke:var(--accent);stroke-width:2.5}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<rect class="" x="24" y="20" width="200" height="88" rx="4"/>
<text class="head" x="124" y="46" text-anchor="middle" xml:space="preserve">1 · Validate</text>
<text class="" x="124" y="71" text-anchor="middle" xml:space="preserve">File / dependencies</text>
<text class="" x="124" y="90" text-anchor="middle" xml:space="preserve">Stack allowances</text>
<path class="arrow" d="M226 64 L254 64" marker-end="url(#arrow)"/>
<rect class="" x="260" y="20" width="200" height="88" rx="4"/>
<text class="head" x="360" y="46" text-anchor="middle" xml:space="preserve">2 · Relocate</text>
<text class="" x="360" y="71" text-anchor="middle" xml:space="preserve">Patch the loaded</text>
<text class="" x="360" y="90" text-anchor="middle" xml:space="preserve">Image at 0100h</text>
<path class="arrow" d="M462 64 L490 64" marker-end="url(#arrow)"/>
<rect class="" x="496" y="20" width="200" height="88" rx="4"/>
<text class="head" x="596" y="46" text-anchor="middle" xml:space="preserve">3 · Move resident</text>
<text class="" x="596" y="71" text-anchor="middle" xml:space="preserve">Tentative boundary</text>
<text class="" x="596" y="90" text-anchor="middle" xml:space="preserve">PZTOP not committed</text>

<path class="arrow" d="M696 108 V132 H12 V207 H18" marker-end="url(#arrow)"/>
<rect class="" x="24" y="163" width="200" height="88" rx="4"/>
<text class="head" x="124" y="189" text-anchor="middle" xml:space="preserve">4 · Run INIT</text>
<text class="" x="124" y="214" text-anchor="middle" xml:space="preserve">Initialise the service</text>
<text class="" x="124" y="233" text-anchor="middle" xml:space="preserve">Return records</text>
<path class="arrow" d="M226 207 L254 207" marker-end="url(#arrow)"/>
<rect class="" x="260" y="163" width="200" height="88" rx="4"/>
<text class="head" x="360" y="189" text-anchor="middle" xml:space="preserve">5 · Check records</text>
<text class="" x="360" y="214" text-anchor="middle" xml:space="preserve">Validate bounds</text>
<text class="" x="360" y="233" text-anchor="middle" xml:space="preserve">And registry capacity</text>
<path class="arrow" d="M462 207 L490 207" marker-end="url(#arrow)"/>
<rect class="" x="496" y="163" width="200" height="88" rx="4"/>
<text class="head" x="596" y="189" text-anchor="middle" xml:space="preserve">6 · Commit</text>
<text class="" x="596" y="214" text-anchor="middle" xml:space="preserve">Publish registry</text>
<text class="" x="596" y="233" text-anchor="middle" xml:space="preserve">Commit PZTOP</text>

<text class="note" x="360" y="280" text-anchor="middle" xml:space="preserve">Failure takes cleanup paths before a successful reservation commit.</text>
<text class="note" x="360" y="302" text-anchor="middle" xml:space="preserve">INIT must undo its own device or hook changes where required.</text>
</svg>
