<svg xmlns="http://www.w3.org/2000/svg" width="720" height="326" viewBox="0 0 720 326" role="img" aria-labelledby="title desc">
<title id="title">Program memory below the resident boundary</title>
<desc id="desc">A schematic, not to scale: page zero is below 0100h. The TPA starts at 0100h and ends before the entry address held in the word at 0006h. Resident services and system reservations are above it. Their sizes depend on the build and card.</desc>
<defs><style>
svg {color:#233333;--panel:#edf4ee;--edge:#648479;--accent:#155c48;--paper:#fff}
@media(prefers-color-scheme:dark) {svg {color:#eef4ef;--panel:#172c27;--edge:#739888;--accent:#a3dfbd;--paper:#1c1f22}}
rect {fill:var(--panel);stroke:var(--edge);stroke-width:1.3}
text {fill:currentColor;font:14px ui-monospace,monospace}
.head {fill:var(--accent);font:bold 16px system-ui,sans-serif}
.note {font:14px system-ui,sans-serif}
.accent {fill:var(--accent);font-weight:bold}
.arrow {fill:none;stroke:var(--accent);stroke-width:1.6}
.highlight {stroke:var(--accent);stroke-width:2.5}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="var(--accent)"/></marker></defs>
<text class="note" x="24" y="32" text-anchor="start" xml:space="preserve">Higher addresses</text>
<text class="note" x="696" y="32" text-anchor="end" xml:space="preserve">Schematic: not to scale</text>
<rect class="" x="185" y="49" width="350" height="62" rx="4"/>
<text class="head" x="360" y="75" text-anchor="middle" xml:space="preserve">System reservations</text>
<text class="" x="360" y="98" text-anchor="middle" xml:space="preserve">Workspace, vectors and entry stub</text>
<rect class="" x="185" y="111" width="350" height="53" rx="4"/>
<text class="head" x="360" y="143" text-anchor="middle" xml:space="preserve">Installed resident services</text>
<rect class="highlight" x="185" y="164" width="350" height="89" rx="4"/>
<text class="head" x="360" y="197" text-anchor="middle" xml:space="preserve">Transient program area</text>
<text class="" x="360" y="225" text-anchor="middle" xml:space="preserve">Program code, data and private stack</text>
<rect class="" x="185" y="253" width="350" height="40" rx="4"/>
<text class="" x="360" y="279" text-anchor="middle" xml:space="preserve">Page zero: jumps and buffers</text>
<text class="accent" x="171" y="170" text-anchor="end" xml:space="preserve">(0006h)</text>
<text class="" x="171" y="257" text-anchor="end" xml:space="preserve">0100h</text>
<text class="" x="171" y="288" text-anchor="end" xml:space="preserve">0000h</text>
<text class="note" x="360" y="318" text-anchor="middle" xml:space="preserve">The address held at 0006h is excluded from the TPA.</text>
</svg>
